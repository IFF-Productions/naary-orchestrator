name: Release

# Cut a release from main: pick patch/minor/major, bump every workspace package.json
# to the next semver, commit + tag vX.Y.Z, publish a GitHub Release, then deploy that
# tag (chained call — see the note in deploy.yml about why the `release` event can't
# do the chaining).
#
# Usage: Actions → Release → Run workflow → bump = patch | minor | major.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      contents: write # push the bump commit + tag, create the release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Base the bump on the LATEST v* TAG, not package.json — tags are the record of
      # what was actually released, and the two can drift (v0.0.3 was tagged without a
      # bump commit, leaving package.json at 0.0.2; bumping from package.json would then
      # try to re-mint an existing tag). Fall back to package.json only when no release
      # tag exists yet. checkout is shallow and tagless, so read tags from the remote.
      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          BASE=$(git ls-remote --tags origin 'refs/tags/v[0-9]*' \
            | awk -F'refs/tags/' '{print $2}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          BASE="${BASE#v}"
          if [ -z "$BASE" ]; then
            BASE=$(node -p "require('./package.json').version")
          fi
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::base version '$BASE' is not plain X.Y.Z"
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<EOF
          $BASE
          EOF
          case "$BUMP" in
            major) VERSION="$((MAJ + 1)).0.0" ;;
            minor) VERSION="$MAJ.$((MIN + 1)).0" ;;
            patch) VERSION="$MAJ.$MIN.$((PAT + 1))" ;;
            *) echo "::error::unknown bump type '$BUMP'"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "Releasing: $BASE --($BUMP)--> $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Root + every apps/* and packages/* manifest get the release version. Purely a
      # stamp — all are private workspace packages (workspace:* deps, nothing published),
      # so the lockfile is unaffected and CI's --frozen-lockfile stays green.
      - name: Bump workspace package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          const files = ['package.json'];
          for (const dir of ['apps', 'packages'])
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir, name, 'package.json');
              if (fs.existsSync(p)) files.push(p);
            }
          for (const p of files) {
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log(`${p} → ${process.env.VERSION}`);
          }
          NODE

      - name: Commit, tag, push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    # A called workflow can only downgrade the caller's token — grant here what
    # deploy.yml's jobs need (packages: write to push the GHCR images).
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
