name: CI

# Gate every PR (and pushes to main) on typecheck + tests + web build. The test
# suite mocks @naary/db, so no Postgres is needed; the Temporal e2e tests spin up
# @temporalio/testing's in-process server. No secrets required — a dummy .env only
# satisfies the prisma-generate dotenv wrapper (generate never connects).
#
# WHY THREE JOBS. This was one `verify` job taking ~11 min, ~10.8 of them inside a single
# `pnpm test` step. Measured from a real run (315 files, 644s wall):
#
#   * the 13 apps/worker `*.e2e.spec.ts` files own **432s of the 439s** of test time — each
#     boots its own Temporal TestWorkflowEnvironment. The other 302 files total ~7s.
#   * effective parallelism was **1**: (import 160s + tests 439s) / 644s wall ≈ 0.93.
#     ubuntu-latest on a private repo is 2 vCPU and vitest defaults to `cpus - 1` workers,
#     so the entire suite ran serially on one core.
#
# So the answer is more RUNNERS, not more threads — and grouping, not a blind `--shard` over
# everything, because `--shard` splits by file ordered by SIZE, which does not predict a 67s
# Temporal boot. The split lives in vitest.config.ts (VITEST_SPLIT) so the two halves are
# exact complements by construction; see that file for why it is not CLI `--exclude` flags.
#
# Measured and REJECTED, so it doesn't get re-tried: reusing the prebuilt workflow bundle
# (apps/worker/dist/workflow-bundle.js, #676) in the test harness instead of
# Worker.create({ workflowsPath }) — 17.0s → 16.2s on the slowest spec. The cost is the
# Temporal dev server per file, not the webpack bundle.
#
# Runs on GitHub-hosted ubuntu-latest. Fork PRs are skipped (the `if:` guards), retained as a
# policy choice (conserve CI minutes / keep repo-scoped tokens away from fork code) — no
# longer a self-hosted necessity, so fork CI can be enabled here if wanted.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 13 heavy files over 4 shards ≈ 110s each, against a hard floor of 67s (the single
  # slowest file). More shards buy almost nothing past that; fewer leave a ~3 min shard.
  # The `matrix.shard` list below must have exactly this many entries.
  WORKER_E2E_SHARDS: 4

jobs:
  # No tests, so this lands in ~2 min and catches most PR mistakes well before the suites do.
  static:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Typecheck (tsc -b + per-package)
        run: pnpm typecheck

      # A raw control byte makes grep treat the whole file as BINARY, so it vanishes from every
      # text search — review, grep-based CI steps, audits. Cheap to check, invisible to catch by
      # eye. See scripts/check-control-bytes.mjs.
      - name: Check for raw control bytes in source
        run: pnpm check:control-bytes

      # Every .mjs here is manual tooling, and CI checks each script's committed OUTPUT rather
      # than the script — so extract-openapi-fixtures.mjs stayed a SyntaxError for over a day and
      # across a release (#950/#984) with nothing reporting it. Parsing costs ~1s. See #985 and
      # scripts/check-mjs-syntax.mjs, which explains why this is not `node --check $(git ls-files)`.
      - name: Check .mjs scripts parse
        run: pnpm check:mjs-syntax

      # Regenerate the OpenAPI spec from the API's controllers/DTOs and fail if the
      # committed apps/api/openapi.json drifts. The web's typed client
      # (apps/web/src/lib/api/schema.d.ts) is a deterministic function of that spec
      # and is generated on demand (untracked, #499), so diffing the spec is enough.
      - name: Check API types drift (openapi spec)
        run: pnpm check:api-types

      # docs/integrations holds one generated page per provider in INTEGRATION_CATALOG, and
      # integration-docs.spec.ts already byte-diffs every one of them against disk — but it
      # imports the renderer from `src` and only COMPARES, and check:mjs-syntax only PARSES.
      # Nothing yet RUNS gen-integration-docs.mjs, which reads the BUILT `dist`: an export that
      # stops surviving the build, a bad path join, or its missing-prose exit passes both of
      # those and still leaves the generator — the only writer of those pages — unable to
      # produce them. Executing it for real costs seconds, not minutes. See #1033.
      # The diff is path-scoped to docs/integrations, so the dummy .env that setup-workspace
      # writes cannot dirty it. Untracked files are outside `git diff` — a brand-new provider
      # page is what the spec's existsSync assertion covers.
      - name: Check integration docs drift (generated provider pages)
        run: pnpm check:integration-docs

      - name: Web build (vite)
        run: pnpm --filter @naary/web run build

  # Everything except the Temporal suite: 303 files, ~7s of test time but most of the
  # module-import cost. `--maxWorkers=2` because vitest's default (`cpus - 1`) is 1 on a
  # 2-vCPU runner, leaving half the box idle on an import-bound job. These files already run
  # 9-wide on a dev laptop, so file parallelism is not a new risk.
  unit:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # `pnpm test` is build + vitest; the two are split here so a failure is attributable
      # and so the vitest flags below aren't appended to a compound script.
      - name: Build (prisma generate + tsc -b)
        run: pnpm build

      - name: Test — everything except the Temporal e2e suite
        env:
          VITEST_SPLIT: unit
        run: pnpm exec vitest run --maxWorkers=2

  # The Temporal suite, sharded. Each file boots a real Temporal dev server, so these stay
  # ONE worker per shard (vitest's default here) — two servers on two cores just thrash.
  worker-e2e:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Don't cancel sibling shards on one failure: seeing EVERY failing shard in one run is
      # worth more than the saved minutes, especially for the chaos/durability specs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4] # keep in step with WORKER_E2E_SHARDS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      - name: Build (prisma generate + tsc -b)
        run: pnpm build

      - name: Test — Temporal e2e (incl. determinism replay + pause/resume)
        env:
          VITEST_SPLIT: worker-e2e
        run: >-
          pnpm exec vitest run
          --shard=${{ matrix.shard }}/${{ env.WORKER_E2E_SHARDS }}

  # One stable check name for the whole gate. `main` has no required status checks today, but
  # a matrix names its checks `worker-e2e (1)`, `worker-e2e (2)`, … — so anything pinned to a
  # job name would silently stop gating the next time the shard count changes. Point branch
  # protection at THIS job instead.
  verify:
    if: always()
    needs: [static, unit, worker-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs.worker-e2e` cannot be written with a dot — the hyphen parses as subtraction.
      # A matrix job's aggregate result is `success` only if every shard succeeded.
      - name: Require every job to have succeeded
        run: |
          static='${{ needs.static.result }}'
          unit='${{ needs.unit.result }}'
          e2e='${{ needs['worker-e2e'].result }}'
          echo "static=$static unit=$unit worker-e2e=$e2e"
          for r in "$static" "$unit" "$e2e"; do
            # `skipped` passes: a fork PR skips all three by design (see the `if:` guards),
            # and failing the gate for that would block every fork PR outright.
            case "$r" in
              success | skipped) ;;
              *)
                echo "::error::CI gate failed"
                exit 1
                ;;
            esac
          done
