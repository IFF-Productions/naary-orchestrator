name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot. GitHub does NOT expose repository secrets to workflows triggered by
    # Dependabot (they live in a separate Dependabot secret store), so
    # `secrets.CLAUDE_CODE_OAUTH_TOKEN` arrives EMPTY and the action fails — visible in the run log
    # as `"claude_code_oauth_token": ""`.
    #
    # That made every Dependabot PR permanently red on this check: #787 sat failing for two days
    # with a red X that had nothing to do with its contents. A check that can only ever fail is
    # worse than no check, because it teaches people to merge past red.
    #
    # If a bot review of version bumps is wanted later, the fix is to add the token under
    # Settings → Secrets → Dependabot, not to remove this guard.
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

