name: Deploy

# Deploys a RELEASE to the Hetzner box (deploy/README.md) from PREBUILT GHCR images:
#   build job  — builds ghcr.io/<owner>/naary-backend + naary-web for the ref and pushes
#                them, UNLESS both tags already exist (so a rollback pulls the exact
#                bytes that ran before, never a rebuild).
#   sandbox-images job — reusable workflow (.github/workflows/sandbox-images.yml) that
#                resolves the four codeAgent SANDBOX images to DIGEST-pinned GHCR refs,
#                building only the ones whose content tag isn't published yet. They are
#                tagged by CONTENT, not by release, so an app release almost never pays
#                for them. Its outputs become the runner's SANDBOX_IMAGE_* below.
#   deploy job — ships the compose files over SSH, logs the box into GHCR with this
#                run's EPHEMERAL GITHUB_TOKEN (no long-lived registry credential ever
#                touches the server), then `compose pull` + `up -d --no-build`.
#
# The repo is NOT cloned on the server — no source, no PAT in .git/config.
#
# Three ways in:
#   - chained from release.yml (the normal path — Actions → Release → run workflow)
#   - `release: published` — for releases created by hand in the GitHub UI / gh CLI
#     (release.yml can't use this: a release published with the workflow's own
#     GITHUB_TOKEN never retriggers workflows — GitHub loop protection)
#   - workflow_dispatch with an explicit ref, for reruns/rollbacks (pick any tag)
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — private half of the dedicated deploy keypair
#                     (public half = deploy_ssh_public_key in deploy/terraform).
#   DEPLOY_HOST     — the server's IPv4 (terraform output -raw server_ipv4).
# Optional repo secrets (publishable client-side values, kept as secrets for convenience):
#   VITE_FIREBASE_* / VITE_SENTRY_* — baked into the web bundle at build time; unset ⇒
#   same behavior as before (Firebase login off in the SPA, Sentry off).
#   SENTRY_DSN / SENTRY_TRACES_SAMPLE_RATE / SENTRY_PROFILES_SAMPLE_RATE — backend (api/
#   worker) Sentry env, exported on the box for compose; unset ⇒ the box's /opt/naary/.env
#   value (if any) still applies. SENTRY_RELEASE defaults to the deployed tag.
#   OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_EXPORTER_OTLP_HEADERS / OTEL_EXPORTER_OTLP_PROTOCOL —
#   backend (api/worker) OTLP metrics export (Datadog/OTLP, #462), same box-.env-override
#   path as the Sentry env; unset ⇒ OTLP export stays OFF. HEADERS carries the intake auth.
#
# Deploys via a GITHUB-HOSTED runner (unlike ci.yml/e2e.yml): it only needs SSH egress,
# and keeping prod credentials off the shared self-hosted runner is the safer split.
# NOTE: runner IPs vary — ssh_allowed_cidrs in Terraform must stay open (default) or
# include GitHub's ranges, or this workflow can't reach port 22.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: Tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (vX.Y.Z) or branch to deploy — rollback = rerun with an older tag
        type: string
        default: main

# Never run two deploys at once; queue (don't cancel) a deploy already in flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ inputs.ref || github.event.release.tag_name }}
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR repository paths MUST be lowercase, but github.repository_owner preserves the
      # org's canonical case (e.g. "IFF-Productions"), which buildx rejects with
      # `repository name must be lowercase`. Lowercase it once here so both the image tags
      # below and the deploy job's `docker pull` get a valid ghcr.io/<owner> path.
      - name: Lowercase IMAGE_BASE for GHCR
        run: echo "IMAGE_BASE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # DEPLOY_REF becomes a docker image tag and is embedded in the remote command
      # line — reject anything outside safe tag characters (no '/', so tags or `main`;
      # slash-branches can't be image tags anyway).
      - name: Validate ref
        run: |
          if ! printf '%s' "$DEPLOY_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::ref '$DEPLOY_REF' has characters outside [A-Za-z0-9._-]"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Rollbacks and re-runs must deploy the EXISTING artifact, never a rebuild —
      # checked PER IMAGE, so a partially-pushed tag (e.g. backend made it, web didn't)
      # only builds the missing one and never overwrites the one that exists.
      - name: Check which images already exist for this tag
        id: exists
        run: |
          for img in backend web sandbox-runner; do
            # Output keys go through a GH expression, where a dash reads as minus → _.
            key="${img//-/_}"
            if docker manifest inspect "$IMAGE_BASE/naary-$img:$DEPLOY_REF" >/dev/null 2>&1; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
              echo "naary-$img:$DEPLOY_REF already in GHCR — will not rebuild/overwrite it."
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.backend != 'true' || steps.exists.outputs.web != 'true' || steps.exists.outputs.sandbox_runner != 'true'

      - name: Build + push backend image (api / worker / migrate)
        if: steps.exists.outputs.backend != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/naary-backend:${{ env.DEPLOY_REF }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # VITE_* are inlined into the bundle at build time, so they come from repo
      # VARIABLES here (publishable client-side config, not secrets) instead of the
      # server .env. VITE_APP_VERSION is stamped with the release tag.
      - name: Build + push web image (SPA + nginx)
        if: steps.exists.outputs.web != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/naary-web:${{ env.DEPLOY_REF }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_APPCHECK_SITE_KEY=${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
            VITE_FIREBASE_APPCHECK_PROVIDER=${{ secrets.VITE_FIREBASE_APPCHECK_PROVIDER }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            VITE_SENTRY_PROFILES_SAMPLE_RATE=${{ secrets.VITE_SENTRY_PROFILES_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ secrets.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${{ secrets.VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
            VITE_APP_VERSION=${{ env.DEPLOY_REF }}

      # codeAgent sandbox runner (apps/sandbox-runner): the one container that holds the
      # Docker socket, so it is its OWN image — deliberately not the shared backend image
      # (no app secrets, no DB access, no workspace deps). Compose can only pull it from
      # GHCR like the others. The SANDBOX images it LAUNCHES are built by the
      # `sandbox-images` job below (they are content-tagged, not release-tagged, so they
      # do not belong in this per-release loop).
      - name: Build + push sandbox-runner image (codeAgent sandbox launcher)
        if: steps.exists.outputs.sandbox_runner != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/sandbox/runner.Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/naary-sandbox-runner:${{ env.DEPLOY_REF }}
          cache-from: type=gha,scope=sandbox-runner
          cache-to: type=gha,scope=sandbox-runner,mode=max

  # The four codeAgent SANDBOX images the runner launches. A separate, reusable workflow because
  # their build cadence is NOT the release cadence: they are tagged by the content hash of their
  # Dockerfile, so this job normally just resolves four already-published refs to their digests
  # (seconds) and only builds when a Dockerfile or deploy/sandbox/IMAGE_EPOCH actually changed.
  #
  # Its outputs are DIGEST-pinned refs, which is the point: the runner holds the Docker socket, so
  # what it launches must be immutable bytes, not a `:latest` tag anyone can re-push under.
  # `env.DEPLOY_REF` is not available in a job-level `with:`, hence the repeated expression.
  sandbox-images:
    uses: ./.github/workflows/sandbox-images.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ inputs.ref || github.event.release.tag_name }}

  deploy:
    needs: [build, sandbox-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # the box pulls with this run's ephemeral token
    # Auto-created on first run. Add a "required reviewers" protection rule to this
    # environment in repo settings to make every deploy click-to-approve.
    environment: production
    steps:
      # Same lowercasing as the build job: the box's `docker pull $IMAGE_BASE/...` also
      # rejects an uppercase owner. (Set per job — $GITHUB_ENV doesn't cross jobs.)
      - name: Lowercase IMAGE_BASE for GHCR
        run: echo "IMAGE_BASE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Ship compose files + deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          # Backend Sentry env (worker + api). The DSN is near-publishable, but flows the
          # same env-prefix path as GHCR_TOKEN: never written to disk on the box.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Per-app DSNs (optional). Set these to give each app its OWN Sentry project —
          # separate issue streams, alerts and quotas. Unset ⇒ that app uses SENTRY_DSN.
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          SENTRY_DSN_WORKER: ${{ secrets.SENTRY_DSN_WORKER }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILES_SAMPLE_RATE }}
          # OTLP metrics export (Datadog/OTLP, #462) — OFF unless the endpoint is set.
          # HEADERS carries the intake auth (DD-API-KEY); flows the same secret path.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
          # codeAgent sandbox images, DIGEST-pinned by the sandbox-images job. These are not
          # secrets — they are here for the same reason the Sentry env is: this is the channel
          # that reaches the box's compose without ever being written to a file on it.
          SANDBOX_IMAGE_CLAUDE: ${{ needs.sandbox-images.outputs.claude }}
          SANDBOX_IMAGE_CURSOR: ${{ needs.sandbox-images.outputs.cursor }}
          SANDBOX_IMAGE_COPILOT: ${{ needs.sandbox-images.outputs.copilot }}
          SANDBOX_IMAGE_GEMINI: ${{ needs.sandbox-images.outputs.gemini }}
          # How many releases of each app image the box keeps as rollback targets (#993). Plumbed
          # THROUGH to the remote shell below, unlike the DEPLOY_IMAGE_KEEP_HOURS it replaces:
          # that one was read on the box but never appeared in the ssh env list, so it could not be
          # set from anywhere and its 336h default was hardcoded in practice. A knob that cannot be
          # turned reads as a supported override in review and isn't one — hence the vars fallback
          # here AND the `${…:-2}` default on the box, so both ends have an answer.
          DEPLOY_IMAGE_KEEP_RELEASES: ${{ vars.DEPLOY_IMAGE_KEEP_RELEASES || '2' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$DEPLOY_HOST"

          # The box needs only the compose files (+ its .env, which stays put) — no repo.
          # deploy/sandbox/ rides along because the prod overlay bind-mounts its squid
          # allowlist, and enabling the sandbox profile needs its Dockerfile + egress test
          # ON the box (see deploy/docker-compose.prod.yml's sandbox services).
          tar czf - docker-compose.yml \
            deploy/docker-compose.prod.yml deploy/docker-compose.neon.yml deploy/docker-compose.ghcr.yml \
            deploy/sandbox \
            | $SSH "mkdir -p /opt/naary && tar xzf - -C /opt/naary"

          $SSH "DEPLOY_REF='$DEPLOY_REF' IMAGE_BASE='$IMAGE_BASE' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' SENTRY_DSN='$SENTRY_DSN' SENTRY_DSN_API='$SENTRY_DSN_API' SENTRY_DSN_WORKER='$SENTRY_DSN_WORKER' SENTRY_TRACES_SAMPLE_RATE='$SENTRY_TRACES_SAMPLE_RATE' SENTRY_PROFILES_SAMPLE_RATE='$SENTRY_PROFILES_SAMPLE_RATE' OTEL_EXPORTER_OTLP_ENDPOINT='$OTEL_EXPORTER_OTLP_ENDPOINT' OTEL_EXPORTER_OTLP_HEADERS='$OTEL_EXPORTER_OTLP_HEADERS' OTEL_EXPORTER_OTLP_PROTOCOL='$OTEL_EXPORTER_OTLP_PROTOCOL' SANDBOX_IMAGE_CLAUDE='$SANDBOX_IMAGE_CLAUDE' SANDBOX_IMAGE_CURSOR='$SANDBOX_IMAGE_CURSOR' SANDBOX_IMAGE_COPILOT='$SANDBOX_IMAGE_COPILOT' SANDBOX_IMAGE_GEMINI='$SANDBOX_IMAGE_GEMINI' DEPLOY_IMAGE_KEEP_RELEASES='$DEPLOY_IMAGE_KEEP_RELEASES' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/naary
          # Ensure swap exists BEFORE the rolling replace. docker-rollout scales a service
          # to 2x (start-first), so during the worker roll a second worker boots while the
          # old one is still resident — and a worker's boot briefly spikes RSS (in-process
          # webpack bundle of the workflow code + the quickjs-emscripten WASM runtime). On the
          # 8GB box with no swap the kernel OOM-kills the NEW worker before its /metrics health
          # endpoint binds, so the health gate never passes and docker-rollout reverts
          # ("New containers are not healthy. Rolling back."). A swapfile absorbs the transient
          # spike. Idempotent + SIZE-aware: checks SwapTotal, not mere presence — a box with
          # only a tiny existing swap (e.g. a 512MB zram device) would otherwise skip and still
          # OOM. Uses dd (not fallocate) so the file has no holes — swapon rejects sparse files.
          # Persists via fstab; logs the total in both branches for verification.
          SWAP_TARGET_KB=4194304 # 4 GiB
          cur_kb=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          echo "current swap total: $((cur_kb / 1024))MB"
          if [ "$cur_kb" -lt "$SWAP_TARGET_KB" ]; then
            echo "below 4GiB target — ensuring /swapfile (4G)"
            swapoff /swapfile 2>/dev/null || true # replace a partial/smaller prior file cleanly
            rm -f /swapfile
            dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
            chmod 600 /swapfile
            mkswap /swapfile >/dev/null
            swapon /swapfile
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            echo "swap after: $(($(awk '/^SwapTotal:/ {print $2}' /proc/meminfo) / 1024))MB"
          else
            echo "swap already >= 4GiB ($((cur_kb / 1024))MiB) — skipping"
          fi
          # Boxes cloud-init'd by the pre-GHCR template staged the .env one level up.
          if [ -f /opt/naary.env ] && [ ! -f /opt/naary/.env ]; then
            mv /opt/naary.env /opt/naary/.env && chmod 600 /opt/naary/.env
          fi
          # Fail fast with a clear message — without .env, compose dies on every
          # ${VAR:?} interpolation with far more confusing errors.
          if [ ! -f /opt/naary/.env ]; then
            echo "::error::/opt/naary/.env is missing on the server. cloud-init stages it on first boot; restore it with: terraform -chdir=deploy/terraform output -raw server_env > /opt/naary/.env && chmod 600 /opt/naary/.env"
            exit 1
          fi
          # Ephemeral packages:read token — expires with the workflow run anyway, but
          # don't leave it in the box's docker config even that long: logout on ANY
          # exit (set -e would otherwise skip a trailing logout on pull/up failure).
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          FILES="-f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.neon.yml -f deploy/docker-compose.ghcr.yml"
          COMPOSE="docker compose $FILES"
          export APP_VERSION="$DEPLOY_REF" IMAGE_BASE
          # Backend Sentry env: a repo secret, when SET, overrides the box .env; an UNSET
          # secret must not blank a manually-set .env value — compose treats a set-but-EMPTY
          # shell var as set, so unset the empties. Release defaults to the deployed tag.
          [ -n "${SENTRY_DSN:-}" ] || unset SENTRY_DSN
          # Per-app DSN overrides — same rule: set-but-empty would blank a box .env value.
          [ -n "${SENTRY_DSN_API:-}" ] || unset SENTRY_DSN_API
          [ -n "${SENTRY_DSN_WORKER:-}" ] || unset SENTRY_DSN_WORKER
          [ -n "${SENTRY_TRACES_SAMPLE_RATE:-}" ] || unset SENTRY_TRACES_SAMPLE_RATE
          [ -n "${SENTRY_PROFILES_SAMPLE_RATE:-}" ] || unset SENTRY_PROFILES_SAMPLE_RATE
          # An unset OTLP secret must not blank a manually-set box .env value (same as Sentry).
          [ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" ] || unset OTEL_EXPORTER_OTLP_ENDPOINT
          [ -n "${OTEL_EXPORTER_OTLP_HEADERS:-}" ] || unset OTEL_EXPORTER_OTLP_HEADERS
          [ -n "${OTEL_EXPORTER_OTLP_PROTOCOL:-}" ] || unset OTEL_EXPORTER_OTLP_PROTOCOL
          export SENTRY_RELEASE="${SENTRY_RELEASE:-$DEPLOY_REF}"

          # ── codeAgent sandbox images ──────────────────────────────────────────────────────────
          # Is the `sandbox` profile actually on for this box? Ask COMPOSE, not the .env file:
          # `config --services` lists only services in ACTIVE profiles, so this is compose's own
          # resolution of COMPOSE_PROFILES rather than a re-implementation of comma-list parsing.
          # A box without the profile must neither pull ~1.7GiB of coding CLIs nor face the higher
          # free-disk bar below.
          SERVICES="$($COMPOSE config --services)"
          SANDBOX_ON=0
          if printf '%s\n' "$SERVICES" | grep -qx sandbox-runner; then SANDBOX_ON=1; fi
          echo "sandbox profile active: $SANDBOX_ON"

          SANDBOX_IMAGE_REFS=""
          # ALL FOUR empty ⇒ a ROLLBACK to a ref that predates CI-built sandbox images: the
          # sandbox-images job says so deliberately (see its legacy guard). Deploy that ref exactly
          # as its own code expects — no pull, no SANDBOX_REQUIRE_DIGEST — rather than failing.
          # SOME empty is a different thing entirely: a real CI bug. That still aborts below.
          SANDBOX_LEGACY_REF=0
          if [ -z "${SANDBOX_IMAGE_CLAUDE:-}${SANDBOX_IMAGE_CURSOR:-}${SANDBOX_IMAGE_COPILOT:-}${SANDBOX_IMAGE_GEMINI:-}" ]; then
            SANDBOX_LEGACY_REF=1
          fi
          if [ "$SANDBOX_ON" = "1" ] && [ "$SANDBOX_LEGACY_REF" = "1" ]; then
            echo "::warning::No sandbox image refs for this ref — deploying it as a pre-CI-images release. codeAgent will use whatever this box has locally, unpinned. Roll FORWARD to restore digest pinning."
          fi
          if [ "$SANDBOX_ON" = "1" ] && [ "$SANDBOX_LEGACY_REF" = "0" ]; then
            # The runner holds the Docker socket, so what it launches must be immutable BYTES, not
            # a re-pushable tag. Refuse the deploy if any ref isn't digest-pinned rather than
            # letting the box fall back to `naary-*-sandbox:latest` — the runner would refuse to
            # boot anyway (SANDBOX_REQUIRE_DIGEST below), and failing here says why, before the
            # pull touches anything.
            for v in SANDBOX_IMAGE_CLAUDE SANDBOX_IMAGE_CURSOR SANDBOX_IMAGE_COPILOT SANDBOX_IMAGE_GEMINI; do
              eval "ref=\${$v:-}"
              if ! printf '%s' "$ref" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
                echo "::error::$v is not digest-pinned ('$ref'). The sandbox-images job should have supplied a <ref>@sha256:<digest>; aborting before the pull."
                exit 1
              fi
              SANDBOX_IMAGE_REFS="$SANDBOX_IMAGE_REFS $ref"
            done
            # Fail CLOSED in the runner too: with this set it refuses to boot on anything that
            # isn't `@sha256:`-pinned, so a future path that silently drops these vars can't
            # degrade prod back to a mutable `:latest`.
            export SANDBOX_REQUIRE_DIGEST=1
          fi

          # docker-rollout (https://github.com/wowu/docker-rollout): start-first rolling
          # replace for compose services — scale to 2, wait for the NEW container's
          # healthcheck, then stop the old one. A ~10KB bash script we run as root, so we
          # (re)install it every deploy but harden the supply chain: pin to an IMMUTABLE
          # commit SHA (git tags are movable) AND verify a sha256 before making it
          # executable — a tampered/replaced upstream file fails the deploy (set -e). To
          # bump: re-resolve the tag to its commit and recompute the hash.
          mkdir -p ~/.docker/cli-plugins
          ROLLOUT_PLUGIN=~/.docker/cli-plugins/docker-rollout
          ROLLOUT_SHA=a72a9632c38187abd6d8799e4a9d5054a67fe615 # tag v0.14
          ROLLOUT_SHA256=cdeaba6ae9eee3b0b606286e585bbda6787283d801a6ad6d9b9d2bc347fda05b
          curl -fsSL "https://raw.githubusercontent.com/wowu/docker-rollout/${ROLLOUT_SHA}/docker-rollout" \
            -o "$ROLLOUT_PLUGIN"
          echo "${ROLLOUT_SHA256}  ${ROLLOUT_PLUGIN}" | sha256sum -c -
          chmod +x "$ROLLOUT_PLUGIN"

          # RECLAIM DISK **BEFORE** THE PULL. The backend image is ~4-5GB (it keeps devDeps and
          # installs three coding CLIs), so every release adds that much. The old post-deploy
          # `docker image prune -f` could never reclaim it: without `-a` it removes only
          # DANGLING images, and a previous release is TAGGED (naary-backend:v0.0.27), so it was
          # never collected — ~4GB accumulated per release until a pull died mid-extract with
          # "no space left on device" (v0.0.29). Running here, before the pull, is what actually
          # makes room for the incoming images.
          #
          # RETENTION IS COUNTED IN RELEASES, NOT DAYS (#993).
          #
          # This used to be `prune -af --filter until=${KEEP_HOURS}h` with KEEP_HOURS=336 — "14
          # days of rollback targets". Days only equal releases at a fixed cadence, and this repo's
          # cadence is not fixed: 60 releases landed in the last 14 days, 8 of them on one day. So
          # NOTHING on the box was ever old enough to be eligible, the prune reclaimed exactly 0
          # bytes on every deploy (identical df before/after in the logs), and images grew until a
          # release hit the pre-pull guard below and stopped:
          #
          #     Images   57 total, 6 active, 54.45GB, 46.86GB reclaimable (86%)
          #     Build Cache                            0B  0B
          #
          # 86% of the image store was collectable the whole time. That `Build Cache 0B` line is
          # also why the `builder prune` below has never reclaimed anything and never will on this
          # box — it PULLS from GHCR, it does not build. Kept because it costs nothing and is
          # correct the day something does build here.
          #
          # Two releases are retained as rollback targets (`Deploy` with an older tag finds the
          # image locally instead of re-pulling; anything older re-pulls on demand — slower, never
          # wrong). Deliberately small: at 8 releases/day a generous window is how this failed.
          #
          # Scoping the listing to the APP repositories is what protects the codeAgent sandbox
          # images, and it protects them structurally rather than by a `label!=` filter someone has
          # to remember. They live in a different repository (naary-sandbox-runner) so they are
          # never listed here at all. That matters because sandbox containers are `--rm`, so
          # nothing references their images between runs and a blanket `prune -a` deletes the image
          # the next codeAgent run needs (~1.7GiB re-pull). Stale sandbox images are reclaimed by
          # the targeted sweep at the end of this script.
          #
          # No `-f` on the rmi: docker refuses to remove an image a container uses, so the RUNNING
          # release survives even when a rollback has left it older than the newest N. `|| true`
          # everywhere, so a reclaim hiccup never fails an otherwise-good deploy.
          KEEP_RELEASES="${DEPLOY_IMAGE_KEEP_RELEASES:-2}"
          echo "disk before reclaim:"; df -h / | tail -1
          for repo in naary-backend naary-web; do
            # `{{.CreatedAt}}` is fixed-width and leads the line, so a plain reverse string sort is
            # newest-first. `$NF` is the ref (it can contain no spaces). Untagged (`:<none>`) rows
            # are dropped — they are not rollback targets and `docker rmi` cannot take that ref;
            # the dangling prune below is what collects them. The whole pipeline is `|| true`'d
            # because this script runs under `set -euo pipefail`, where `grep` matching nothing is
            # a nonzero status that would abort the deploy on a box with no images yet.
            stale="$(docker image ls --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' "$IMAGE_BASE/$repo" 2>/dev/null \
              | grep -v ':<none>$' \
              | sort -r \
              | awk -v keep="$KEEP_RELEASES" 'NR > keep { print $NF }' || true)"
            for ref in $stale; do
              docker rmi "$ref" >/dev/null 2>&1 || true
            done
          done
          # Collects the layers the rmi's just orphaned. No `-a`: dangling only, so it cannot
          # touch a retained release or a sandbox image.
          docker image prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          echo "disk after reclaim:"; df -h / | tail -1

          # Fail EARLY with an actionable message rather than dying mid-layer-extract. The
          # incoming backend image needs ~5GiB unpacked, and web/netdata a little more; 12GiB is
          # headroom for both plus the 2x-scale rollout overlap. `df --output=avail` reports 1K
          # (1024-byte) blocks, so the threshold and the message below are GiB, not GB.
          #
          # The four sandbox images add ~1.7GiB on disk MEASURED HONESTLY: they all derive from
          # node:24-bookworm-slim (231MB, stored once by overlay2), and the per-image `du -sm /`
          # figures are claude 578 / cursor 552 / copilot 857 / gemini 430 MB — so the union is
          # 231 + (347+321+626+199) ≈ 1724MB, NOT the 2.4GB you get by summing them. Round the
          # allowance up to 2GiB to cover the transient compressed blobs during extraction. Applied
          # ONLY when the sandbox profile is on, so boxes that don't run codeAgent keep the old bar.
          # `if`, not `[ … ] && x=2`: this script runs under `set -e`, where a false test as the
          # last command of an && list is a nonzero status and would abort the deploy on every box
          # WITHOUT the sandbox profile.
          SANDBOX_DISK_GIB=0
          if [ -n "$SANDBOX_IMAGE_REFS" ]; then SANDBOX_DISK_GIB=2; fi
          MIN_AVAIL_GIB=$((12 + SANDBOX_DISK_GIB))
          AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          MIN_AVAIL_KB=$((MIN_AVAIL_GIB * 1024 * 1024))
          if [ "$AVAIL_KB" -lt "$MIN_AVAIL_KB" ]; then
            echo "::error::Only $((AVAIL_KB / 1024 / 1024))GiB free on / — need ~${MIN_AVAIL_GIB}GiB to pull this release. Reclaim space on the box (docker image prune -af; docker builder prune -af), or grow the disk. Aborting BEFORE the pull so the running release stays untouched."
            docker system df || true
            exit 1
          fi

          $COMPOSE pull

          # The sandbox images are NOT compose services — the runner launches them through the host
          # Docker — so compose can't pull them. Pull them here, by digest. Cheap when the box
          # already has them (a digest match downloads nothing), which is also what self-heals a box
          # whose images were reclaimed. FATAL on failure: a half-provisioned sandbox host would
          # fail every codeAgent run at `docker run` instead, hours later and far from the cause.
          if [ "$SANDBOX_ON" = "1" ]; then
            for ref in $SANDBOX_IMAGE_REFS; do
              echo "pulling sandbox image $ref"
              if ! docker pull -q "$ref" >/dev/null; then
                echo "::error::failed to pull $ref. On the FIRST deploy after this change, make sure the naary-{claude,cursor,copilot,gemini}-sandbox packages exist in GHCR and are linked to this repo so the run's GITHUB_TOKEN can read them (naary-sandbox-runner is the working precedent)."
                exit 1
              fi
            done
          fi

          # 1) Migrations first, to completion. The OLD api/worker keep serving while these
          #    run against the already-live DB — so migrations must stay backward-compatible
          #    (expand/contract): the previous release runs on the new schema for a minute.
          #    migrate keeps its fixed container_name (it is never rolled), and leaving the
          #    exited container in place is what satisfies api/worker's
          #    service_completed_successfully dependency during the rollouts below.
          $COMPOSE up -d --no-build migrate
          rc=$(docker wait naary-migrate)
          if [ "$rc" != "0" ]; then
            echo "migrations failed (exit $rc)"
            $COMPOSE logs --tail=100 migrate
            exit 1
          fi

          # 2) Health-gated rolling replace, ECS-style. Traffic drains via DNS: cloudflared
          #    dials web:80 per connection and web's nginx re-resolves api:3000 per request,
          #    so during the overlap both replicas serve and the retired one just stops
          #    receiving. If a new container never reports healthy, rollout exits nonzero
          #    and the OLD container is left running and serving — a failed deploy keeps
          #    the previous release live instead of taking the site down.
          for svc in api worker web; do
            if ! docker rollout $FILES -t 180 "$svc"; then
              echo "::error::rollout of $svc failed — previous release still serving"
              $COMPOSE ps
              $COMPOSE logs --tail=100 "$svc"
              exit 1
            fi
          done

          # 3) Reconcile everything else (cloudflared, removed services, config-only
          #    changes) — api/worker/web already match the target config, so this is a
          #    no-op for them.
          $COMPOSE up -d --no-build --remove-orphans
          # Dangling-only sweep of what THIS deploy just orphaned (the retired containers'
          # untagged layers). The real reclamation is the pre-pull `prune -af` above — this
          # cannot remove a previous release's TAGGED image and is not meant to.
          docker image prune -f >/dev/null

          # Targeted sandbox sweep — the counterpart to excluding them from the prune above. The
          # general prune can't tell a current sandbox image from a superseded one (neither is
          # referenced by a container), so do it by IDENTITY: keep exactly the four this deploy
          # pulled, drop every other image carrying the sandbox label. Runs only after a successful
          # rollout, and never fails the deploy.
          if [ -n "$SANDBOX_IMAGE_REFS" ]; then
            # Also drop any local `naary-<tool>-sandbox:latest`. Those are hand-built leftovers from
            # before this change, and they are exactly what makes an un-pinned fallback DANGEROUS
            # rather than merely broken: if an operator brings the stack up without CD's env (a
            # manual `compose up`), the runner falls back to `:latest` — and if that tag resolves
            # locally, it silently runs unreviewed bytes with the Docker socket in reach. With the
            # tag absent, the same mistake fails loudly at `docker run`. Untagging can't remove the
            # bytes if they ARE one of the four we just pulled (same image id); that's fine.
            for t in claude cursor copilot gemini; do
              docker rmi "naary-$t-sandbox:latest" >/dev/null 2>&1 || true
            done
            # Both sides must be the SAME id form: `docker images -q` truncates to 12 chars while
            # inspect returns `sha256:<64 hex>`, so --no-trunc is load-bearing — without it nothing
            # would match `keep` and the sweep would delete the images this deploy just pulled.
            keep=" $(docker image inspect -f '{{.Id}}' $SANDBOX_IMAGE_REFS 2>/dev/null | tr '\n' ' ')"
            if [ "$(printf '%s' "$keep" | wc -w)" -eq 4 ]; then
              for id in $(docker images -q --no-trunc --filter "label=com.naary.sandbox=1" | sort -u); do
                case "$keep" in *" $id "*) continue ;; esac
                echo "removing superseded sandbox image $id"
                docker rmi "$id" >/dev/null 2>&1 || true
              done
            else
              echo "skipping sandbox sweep — could not resolve all four current image ids"
            fi
          fi

          echo "Deployed $DEPLOY_REF — rolling replace complete, all services healthy."
          echo "disk after deploy:"; df -h / | tail -1
          REMOTE
