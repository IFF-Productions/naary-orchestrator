name: Deploy

# Deploys a RELEASE to the Hetzner box (deploy/README.md) from PREBUILT GHCR images:
#   build job  — builds ghcr.io/<owner>/naary-backend + naary-web for the ref and pushes
#                them, UNLESS both tags already exist (so a rollback pulls the exact
#                bytes that ran before, never a rebuild).
#   deploy job — ships the compose files over SSH, logs the box into GHCR with this
#                run's EPHEMERAL GITHUB_TOKEN (no long-lived registry credential ever
#                touches the server), then `compose pull` + `up -d --no-build`.
#
# The repo is NOT cloned on the server — no source, no PAT in .git/config.
#
# Three ways in:
#   - chained from release.yml (the normal path — Actions → Release → run workflow)
#   - `release: published` — for releases created by hand in the GitHub UI / gh CLI
#     (release.yml can't use this: a release published with the workflow's own
#     GITHUB_TOKEN never retriggers workflows — GitHub loop protection)
#   - workflow_dispatch with an explicit ref, for reruns/rollbacks (pick any tag)
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — private half of the dedicated deploy keypair
#                     (public half = deploy_ssh_public_key in deploy/terraform).
#   DEPLOY_HOST     — the server's IPv4 (terraform output -raw server_ipv4).
# Optional repo secrets (publishable client-side values, kept as secrets for convenience):
#   VITE_FIREBASE_* / VITE_SENTRY_* — baked into the web bundle at build time; unset ⇒
#   same behavior as before (Firebase login off in the SPA, Sentry off).
#   SENTRY_DSN / SENTRY_TRACES_SAMPLE_RATE / SENTRY_PROFILES_SAMPLE_RATE — backend (api/
#   worker) Sentry env, exported on the box for compose; unset ⇒ the box's /opt/naary/.env
#   value (if any) still applies. SENTRY_RELEASE defaults to the deployed tag.
#   OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_EXPORTER_OTLP_HEADERS / OTEL_EXPORTER_OTLP_PROTOCOL —
#   backend (api/worker) OTLP metrics export (Datadog/OTLP, #462), same box-.env-override
#   path as the Sentry env; unset ⇒ OTLP export stays OFF. HEADERS carries the intake auth.
#
# Deploys via a GITHUB-HOSTED runner (unlike ci.yml/e2e.yml): it only needs SSH egress,
# and keeping prod credentials off the shared self-hosted runner is the safer split.
# NOTE: runner IPs vary — ssh_allowed_cidrs in Terraform must stay open (default) or
# include GitHub's ranges, or this workflow can't reach port 22.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: Tag to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (vX.Y.Z) or branch to deploy — rollback = rerun with an older tag
        type: string
        default: main

# Never run two deploys at once; queue (don't cancel) a deploy already in flight.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ inputs.ref || github.event.release.tag_name }}
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # DEPLOY_REF becomes a docker image tag and is embedded in the remote command
      # line — reject anything outside safe tag characters (no '/', so tags or `main`;
      # slash-branches can't be image tags anyway).
      - name: Validate ref
        run: |
          if ! printf '%s' "$DEPLOY_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::ref '$DEPLOY_REF' has characters outside [A-Za-z0-9._-]"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Rollbacks and re-runs must deploy the EXISTING artifact, never a rebuild —
      # checked PER IMAGE, so a partially-pushed tag (e.g. backend made it, web didn't)
      # only builds the missing one and never overwrites the one that exists.
      - name: Check which images already exist for this tag
        id: exists
        run: |
          for img in backend web; do
            if docker manifest inspect "$IMAGE_BASE/naary-$img:$DEPLOY_REF" >/dev/null 2>&1; then
              echo "$img=true" >> "$GITHUB_OUTPUT"
              echo "naary-$img:$DEPLOY_REF already in GHCR — will not rebuild/overwrite it."
            else
              echo "$img=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.backend != 'true' || steps.exists.outputs.web != 'true'

      - name: Build + push backend image (api / worker / migrate)
        if: steps.exists.outputs.backend != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/naary-backend:${{ env.DEPLOY_REF }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # VITE_* are inlined into the bundle at build time, so they come from repo
      # VARIABLES here (publishable client-side config, not secrets) instead of the
      # server .env. VITE_APP_VERSION is stamped with the release tag.
      - name: Build + push web image (SPA + nginx)
        if: steps.exists.outputs.web != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/naary-web:${{ env.DEPLOY_REF }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            VITE_SENTRY_PROFILES_SAMPLE_RATE=${{ secrets.VITE_SENTRY_PROFILES_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE=${{ secrets.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
            VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE=${{ secrets.VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
            VITE_APP_VERSION=${{ env.DEPLOY_REF }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # the box pulls with this run's ephemeral token
    # Auto-created on first run. Add a "required reviewers" protection rule to this
    # environment in repo settings to make every deploy click-to-approve.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Ship compose files + deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          # Backend Sentry env (worker + api). The DSN is near-publishable, but flows the
          # same env-prefix path as GHCR_TOKEN: never written to disk on the box.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILES_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILES_SAMPLE_RATE }}
          # OTLP metrics export (Datadog/OTLP, #462) — OFF unless the endpoint is set.
          # HEADERS carries the intake auth (DD-API-KEY); flows the same secret path.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ secrets.OTEL_EXPORTER_OTLP_PROTOCOL }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$DEPLOY_HOST"

          # The box needs only the compose files (+ its .env, which stays put) — no repo.
          tar czf - docker-compose.yml \
            deploy/docker-compose.prod.yml deploy/docker-compose.neon.yml deploy/docker-compose.ghcr.yml \
            | $SSH "mkdir -p /opt/naary && tar xzf - -C /opt/naary"

          $SSH "DEPLOY_REF='$DEPLOY_REF' IMAGE_BASE='$IMAGE_BASE' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' SENTRY_DSN='$SENTRY_DSN' SENTRY_TRACES_SAMPLE_RATE='$SENTRY_TRACES_SAMPLE_RATE' SENTRY_PROFILES_SAMPLE_RATE='$SENTRY_PROFILES_SAMPLE_RATE' OTEL_EXPORTER_OTLP_ENDPOINT='$OTEL_EXPORTER_OTLP_ENDPOINT' OTEL_EXPORTER_OTLP_HEADERS='$OTEL_EXPORTER_OTLP_HEADERS' OTEL_EXPORTER_OTLP_PROTOCOL='$OTEL_EXPORTER_OTLP_PROTOCOL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/naary
          # Boxes cloud-init'd by the pre-GHCR template staged the .env one level up.
          if [ -f /opt/naary.env ] && [ ! -f /opt/naary/.env ]; then
            mv /opt/naary.env /opt/naary/.env && chmod 600 /opt/naary/.env
          fi
          # Fail fast with a clear message — without .env, compose dies on every
          # ${VAR:?} interpolation with far more confusing errors.
          if [ ! -f /opt/naary/.env ]; then
            echo "::error::/opt/naary/.env is missing on the server. cloud-init stages it on first boot; restore it with: terraform -chdir=deploy/terraform output -raw server_env > /opt/naary/.env && chmod 600 /opt/naary/.env"
            exit 1
          fi
          # Ephemeral packages:read token — expires with the workflow run anyway, but
          # don't leave it in the box's docker config even that long: logout on ANY
          # exit (set -e would otherwise skip a trailing logout on pull/up failure).
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          FILES="-f docker-compose.yml -f deploy/docker-compose.prod.yml -f deploy/docker-compose.neon.yml -f deploy/docker-compose.ghcr.yml"
          COMPOSE="docker compose $FILES"
          export APP_VERSION="$DEPLOY_REF" IMAGE_BASE
          # Backend Sentry env: a repo secret, when SET, overrides the box .env; an UNSET
          # secret must not blank a manually-set .env value — compose treats a set-but-EMPTY
          # shell var as set, so unset the empties. Release defaults to the deployed tag.
          [ -n "${SENTRY_DSN:-}" ] || unset SENTRY_DSN
          [ -n "${SENTRY_TRACES_SAMPLE_RATE:-}" ] || unset SENTRY_TRACES_SAMPLE_RATE
          [ -n "${SENTRY_PROFILES_SAMPLE_RATE:-}" ] || unset SENTRY_PROFILES_SAMPLE_RATE
          # An unset OTLP secret must not blank a manually-set box .env value (same as Sentry).
          [ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" ] || unset OTEL_EXPORTER_OTLP_ENDPOINT
          [ -n "${OTEL_EXPORTER_OTLP_HEADERS:-}" ] || unset OTEL_EXPORTER_OTLP_HEADERS
          [ -n "${OTEL_EXPORTER_OTLP_PROTOCOL:-}" ] || unset OTEL_EXPORTER_OTLP_PROTOCOL
          export SENTRY_RELEASE="${SENTRY_RELEASE:-$DEPLOY_REF}"

          # docker-rollout (https://github.com/wowu/docker-rollout): start-first rolling
          # replace for compose services — scale to 2, wait for the NEW container's
          # healthcheck, then stop the old one. A ~10KB bash script we run as root, so we
          # (re)install it every deploy but harden the supply chain: pin to an IMMUTABLE
          # commit SHA (git tags are movable) AND verify a sha256 before making it
          # executable — a tampered/replaced upstream file fails the deploy (set -e). To
          # bump: re-resolve the tag to its commit and recompute the hash.
          mkdir -p ~/.docker/cli-plugins
          ROLLOUT_PLUGIN=~/.docker/cli-plugins/docker-rollout
          ROLLOUT_SHA=a72a9632c38187abd6d8799e4a9d5054a67fe615 # tag v0.14
          ROLLOUT_SHA256=cdeaba6ae9eee3b0b606286e585bbda6787283d801a6ad6d9b9d2bc347fda05b
          curl -fsSL "https://raw.githubusercontent.com/wowu/docker-rollout/${ROLLOUT_SHA}/docker-rollout" \
            -o "$ROLLOUT_PLUGIN"
          echo "${ROLLOUT_SHA256}  ${ROLLOUT_PLUGIN}" | sha256sum -c -
          chmod +x "$ROLLOUT_PLUGIN"

          $COMPOSE pull

          # 1) Migrations first, to completion. The OLD api/worker keep serving while these
          #    run against the already-live DB — so migrations must stay backward-compatible
          #    (expand/contract): the previous release runs on the new schema for a minute.
          #    migrate keeps its fixed container_name (it is never rolled), and leaving the
          #    exited container in place is what satisfies api/worker's
          #    service_completed_successfully dependency during the rollouts below.
          $COMPOSE up -d --no-build migrate
          rc=$(docker wait naary-migrate)
          if [ "$rc" != "0" ]; then
            echo "migrations failed (exit $rc)"
            $COMPOSE logs --tail=100 migrate
            exit 1
          fi

          # 2) Health-gated rolling replace, ECS-style. Traffic drains via DNS: cloudflared
          #    dials web:80 per connection and web's nginx re-resolves api:3000 per request,
          #    so during the overlap both replicas serve and the retired one just stops
          #    receiving. If a new container never reports healthy, rollout exits nonzero
          #    and the OLD container is left running and serving — a failed deploy keeps
          #    the previous release live instead of taking the site down.
          for svc in api worker web; do
            if ! docker rollout $FILES -t 180 "$svc"; then
              echo "::error::rollout of $svc failed — previous release still serving"
              $COMPOSE ps
              $COMPOSE logs --tail=100 "$svc"
              exit 1
            fi
          done

          # 3) Reconcile everything else (cloudflared, removed services, config-only
          #    changes) — api/worker/web already match the target config, so this is a
          #    no-op for them.
          $COMPOSE up -d --no-build --remove-orphans
          docker image prune -f >/dev/null
          echo "Deployed $DEPLOY_REF — rolling replace complete, all services healthy."
          REMOTE
