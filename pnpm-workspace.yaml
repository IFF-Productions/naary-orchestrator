packages:
  - 'packages/*'
  - 'apps/*'

# Allow these dependencies' install scripts to run (native binary / codegen).
allowBuilds:
  '@swc/core': true
  protobufjs: true
  '@prisma/client': true
  prisma: true
  '@prisma/engines': true
  esbuild: true
  '@firebase/util': false
  '@scarf/scarf': false
  # msw's postinstall keeps the generated service worker (apps/web/public/mockServiceWorker.js)
  # in sync with the installed msw version — used by Storybook to mock /api.
  msw: true

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.8 || 4.0.12'
  - '@ai-sdk/gateway@4.0.12 || 4.0.16 || 4.0.21'
  - ai@7.0.15 || 7.0.22 || 7.0.29
  - undici@8.7.0
