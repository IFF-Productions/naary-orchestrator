  - '@aws-sdk/client-s3@3.1085.0 || 3.1088.0'
  - fast-xml-parser@5.10.0 || 5.10.1
  - is-unsafe@2.0.0
  - '@storybook/builder-vite@10.5.1 || 10.5.2'
  - '@storybook/csf-plugin@10.5.1 || 10.5.2'
  - '@storybook/react-dom-shim@10.5.1 || 10.5.2'
  - '@storybook/react-vite@10.5.1 || 10.5.2'
  - '@storybook/react@10.5.1 || 10.5.2'
  - storybook@10.5.1 || 10.5.2
  - '@aws-sdk/checksums@3.1000.18'
  - '@aws-sdk/core@3.975.3'
  - '@aws-sdk/credential-provider-env@3.972.59'
  - '@aws-sdk/credential-provider-http@3.972.61'
  - '@aws-sdk/credential-provider-ini@3.973.3'
  - '@aws-sdk/credential-provider-login@3.972.65'
  - '@aws-sdk/credential-provider-node@3.972.69'
