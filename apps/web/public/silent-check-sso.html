<!doctype html>
<html>
  <!--
    Silent SSO helper for keycloak-js. Loaded in a hidden iframe during init to
    check for an existing Keycloak session without a full-page redirect. It just
    relays the auth result back to the parent window.
  -->
  <body>
    <script>
      parent.postMessage(location.href, location.origin);
    </script>
  </body>
</html>
