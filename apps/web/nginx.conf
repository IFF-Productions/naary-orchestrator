# Per-route security headers, keyed on the ORIGINAL request URI.
#
# WHY A MAP AND NOT `add_header` IN THE ROUTE'S OWN LOCATION: the SPA locations end in
# `try_files $uri /index.html`, and that fallback is an INTERNAL REDIRECT to /index.html which
# RE-ENTERS location matching — so the response is emitted from `location /`, and only ITS
# add_header directives apply. A `^~ /f/` block's add_header never took effect for the SPA
# document (it only ever applied to a real file hit). That was invisible while `location /`
# carried no CSP; once it gained `frame-ancestors 'none'` (audit #598) every embedded form/chat
# started being blocked in the browser with "violates ... frame-ancestors 'none'".
#
# `$request_uri` is the ORIGINAL, un-rewritten request line, so it survives the internal
# redirect and lets one add_header serve both postures. nginx OMITS an add_header entirely when
# its value evaluates to the empty string — that's how the embed routes opt OUT of
# X-Frame-Options (which has no "allow any origin" value; CSP frame-ancestors replaces it).
#
# `map` must live at http{} level — this file is included as conf.d/*.conf, which is inside
# http{}, so these belong here ABOVE the server block (they cannot go inside it).
map $request_uri $naary_csp {
  # Public, intentionally EMBEDDABLE pages (docs/design/EMBEDDED-PUBLIC-PAGES.md): anonymous,
  # no cookies (so framing grants no clickjacking/CSRF escalation) and a cross-origin frame
  # can't read their DOM. Abuse protection stays with Turnstile + rate limits + budget cap.
  "~^/f/"   "frame-ancestors *";
  "~^/c/"   "frame-ancestors *";
  # www.google.com + www.gstatic.com in script-src, and www.google.com in frame-src, are
  # for Firebase App Check: its reCAPTCHA provider loads /recaptcha/api.js and an invisible
  # challenge iframe from those hosts. Without them App Check init is blocked by OUR OWN
  # header, which under Auth enforcement means no sign-in at all. App Check's own token
  # endpoint (content-firebaseappcheck.googleapis.com) is already covered by the
  # *.googleapis.com in connect-src. See apps/web/src/lib/app-check.ts.
  default   "default-src 'self'; script-src 'self' https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.firebaseapp.com https://*.sentry.io wss:; worker-src 'self' blob:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://challenges.cloudflare.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

map $request_uri $naary_xfo {
  # Empty ⇒ header omitted, so the embed routes are framable; everything else denies.
  "~^/f/"   "";
  "~^/c/"   "";
  default   "DENY";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
    # Opt the DOCUMENT into the JS Self-Profiling API — required for Sentry browser
    # profiling (browserProfilingIntegration is inert without it). Harmless on asset
    # responses; `always` so error pages carry it too. Chromium-only feature.
    add_header Document-Policy "js-profiling" always;
    # Security headers for the authenticated app (audit #598). NB nginx add_header
    # does NOT inherit into locations that set their own add_header — the public
    # embed routes below keep their permissive frame-ancestors on purpose.
    # CSP: script-src 'self' is the teeth (no inline/eval in the Vite build);
    # connect-src allows same-origin /api plus the SPA's external services (Firebase
    # auth + Sentry ingest); style 'unsafe-inline' is required by React inline styles;
    # worker blob: by Sentry Replay's compression worker.
    # Mapped above so the public embed routes get their own posture even though this
    # location emits their response (try_files internal redirect). See the map comment.
    add_header Content-Security-Policy $naary_csp always;
    add_header X-Frame-Options $naary_xfo always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TLS terminates at the edge (cloudflared); the header rides through to browsers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # PUBLIC hosted pages (forms `/f/:id`, chat `/c/:id`) are EMBEDDABLE on any site
  # (docs/design/EMBEDDED-PUBLIC-PAGES.md, Slice 1). `^~` beats the `location /` prefix so these
  # serve the same SPA entrypoint but explicitly allow framing via CSP `frame-ancestors *`. Safe:
  # the pages are anonymous (no cookies → no clickjacking/CSRF escalation) and a cross-origin frame
  # can't read their DOM; bot/abuse protection stays with Turnstile + rate limits + budget cap.
  # Scoped to these routes ONLY — the authenticated app keeps its default (no frame-ancestors) posture.
  # NB if a CDN/cloudflared layer above nginx ever injects X-Frame-Options, it must be dropped here.
  # Framing posture for these routes comes from the $naary_csp/$naary_xfo maps above (keyed on
  # $request_uri), NOT from an add_header here — see that comment for why an add_header in this
  # block never reached the SPA document.
  location ^~ /f/ {
    try_files $uri /index.html;
    add_header Document-Policy "js-profiling" always;
    add_header Content-Security-Policy $naary_csp always;
    add_header X-Frame-Options $naary_xfo always;
  }
  location ^~ /c/ {
    try_files $uri /index.html;
    add_header Document-Policy "js-profiling" always;
    add_header Content-Security-Policy $naary_csp always;
    add_header X-Frame-Options $naary_xfo always;
  }

  # Proxy the API the same way the Vite dev server does: strip the `/api` prefix
  # before forwarding (lib/api.ts calls `/api/executions`, the controller serves
  # `/executions`). Same origin as the SPA, so no CORS is involved.
  #
  # DNS: resolve the `api` container's IP at RUNTIME via Docker's embedded DNS
  # (127.0.0.11), not once at startup. With a literal `proxy_pass http://api:3000/`
  # nginx caches the upstream IP at boot; recreating the api container (a rebuild /
  # restart gives it a NEW IP) then makes every /api/* call 502 with
  # "connect() failed (111: Connection refused)" until this web container is also
  # restarted. Using a VARIABLE in proxy_pass forces per-request re-resolution. The
  # variable form doesn't do the trailing-slash prefix strip, so `rewrite` does it.
  # Internal-only API surfaces (audit #595): Prometheus metrics and the Swagger
  # UI/schema must not be reachable through the public proxy — the api marks
  # /metrics @Public() on the assumption it is network-restricted, so restrict it
  # here. Internal scraping keeps working container-to-container (api:3000/metrics),
  # which never traverses this proxy. `^~` beats the /api/ prefix location.
  location ^~ /api/metrics { return 404; }
  location ^~ /api/docs { return 404; }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization (bearer token) is forwarded by default.
  }
}
