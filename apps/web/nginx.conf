server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy the API the same way the Vite dev server does: strip the `/api` prefix
  # before forwarding (lib/api.ts calls `/api/executions`, the controller serves
  # `/executions`). The trailing slash on proxy_pass performs that strip. Same
  # origin as the SPA, so no CORS is involved.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization (bearer token) is forwarded by default.
  }
}
