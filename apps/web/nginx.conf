server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: unknown paths fall back to index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy the API the same way the Vite dev server does: strip the `/api` prefix
  # before forwarding (lib/api.ts calls `/api/executions`, the controller serves
  # `/executions`). Same origin as the SPA, so no CORS is involved.
  #
  # DNS: resolve the `api` container's IP at RUNTIME via Docker's embedded DNS
  # (127.0.0.11), not once at startup. With a literal `proxy_pass http://api:3000/`
  # nginx caches the upstream IP at boot; recreating the api container (a rebuild /
  # restart gives it a NEW IP) then makes every /api/* call 502 with
  # "connect() failed (111: Connection refused)" until this web container is also
  # restarted. Using a VARIABLE in proxy_pass forces per-request re-resolution. The
  # variable form doesn't do the trailing-slash prefix strip, so `rewrite` does it.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization (bearer token) is forwarded by default.
  }
}
