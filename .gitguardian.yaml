# GitGuardian configuration — https://docs.gitguardian.com/ggshield-docs/configuration
#
# Human login is Firebase Auth (no Keycloak realm, no demo password). The Firebase
# WEB config in .env.example is public (Firebase web API keys are not secrets);
# the secret-shaped fields (VITE_FIREBASE_API_KEY, the service-account JSON) are
# left blank there. Real secrets live only in the gitignored .env.
version: 2
secret:
  ignored-matches: []
