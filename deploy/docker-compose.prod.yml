# Production overlay: self-hosted app (api/worker/web/postgres), exposed ONLY through a
# Cloudflare Tunnel, with Temporal on TEMPORAL CLOUD (not a local container).
#
# Run it together with the base compose from the repo root (or `pnpm prod`):
#   docker compose --env-file ./deploy/.env -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# What it changes vs the dev stack:
#   1. Closes every published port. Nothing is on the public or LAN interface — the
#      app is reachable ONLY via the tunnel. (postgres stays bound to 127.0.0.1 for
#      local ops / SSH port-forward, never the network.)
#   2. Adds the `cloudflared` tunnel container.
#   3. Uses Temporal Cloud: the base `temporal` start-dev container is profile-gated OFF
#      and api/worker connect to Cloud via env (deploy/.env.prod.example). Durable +
#      managed — no local SQLite to corrupt.
#
# `!override` clears the base port list (Docker Compose >= 2.24). If your compose is
# older, delete the `!override` tag and manually remove the `ports:` from the base file.

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432" # local ops only (psql over SSH tunnel); never exposed
    # Store the DB on the HOST filesystem (bind mount) instead of a named volume, so the
    # data lives in a real folder you can back up/copy/restore — and it survives even
    # `docker compose down -v` (which only removes named/anonymous volumes, not bind mounts).
    # Path is relative to where you run compose (the repo root). Override with PG_DATA_DIR.
    volumes: !override
      - "${PG_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data"

  # Temporal is TEMPORAL CLOUD in prod, not a local container — durable, managed, and
  # immune to the single-file SQLite corruption that took down the dev server. The app
  # connects to Cloud purely via env (TEMPORAL_ADDRESS/NAMESPACE/API_KEY — see
  # deploy/.env.prod.example; handled by @naary/temporal-config, no code change).
  # Profile-gate the base start-dev service so `up` never starts it. (A profiled service
  # is skipped unless its profile is enabled — hence api/worker also drop it from
  # depends_on below, or compose would error referencing an unstarted service.)
  temporal:
    profiles: ["local-temporal-disabled"]

  # api/worker/web are ROLLED on deploy (docker rollout: scale to 2 → wait for the new
  # container's healthcheck → stop the old). That requires NO fixed container_name (a
  # pinned name can't scale to 2) and NO published host ports (two replicas can't share
  # a bind) — hence `container_name: !reset null` on all three. Traffic keeps flowing
  # during the overlap because nothing addresses these by container name: cloudflared
  # dials web:80 and web's nginx re-resolves api:3000 per request (see apps/web/nginx.conf).
  api:
    container_name: !reset null
    ports: !override [] # reached internally as api:3000 (via web's nginx proxy)
    environment:
      # The browser origin the SPA is served from — used for CORS on the control plane.
      CORS_ORIGINS: "https://${PUBLIC_HOSTNAME:-naar-y.com}"
      # Absolute SPA base for the api's own deep links (transactional emails, connect callbacks).
      # The api would otherwise fall back to CORS_ORIGINS; set it explicitly so every service
      # derives links from one var and the fallback isn't load-bearing. Override via APP_BASE_URL.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
      # Swagger off in prod (audit #595): nginx also 404s /api/docs*, this is belt-and-
      # braces so the schema isn't served even if the proxy layer changes. Override
      # with SWAGGER_DISABLED=0 for a debugging session.
      SWAGGER_DISABLED: "${SWAGGER_DISABLED:-1}"
      # Label Sentry events as production (the code otherwise falls back to NODE_ENV → "development").
      SENTRY_ENVIRONMENT: production
      # The api dispatches "Build with AI" runs that use a tenant's Claude Code credential to the
      # SAME sandbox-runner the worker uses (#680) — it no longer ships or spawns the CLI itself.
      # Only URL + token: it uses the runner's EPHEMERAL workspace (no repo, no git), so unlike the
      # worker it needs NO share of the runs-dir bind mount — the internet-facing container gets no
      # writable host path out of this. Empty ⇒ that one generate source answers 503 naming these
      # settings; every API-key provider (Anthropic/OpenAI/Google) is unaffected.
      SANDBOX_RUNNER_URL: "${SANDBOX_RUNNER_URL:-http://sandbox-runner:8099}"
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-}"
    # Drop the local-temporal dependency (Temporal is Cloud); keep DB + migrations.
    depends_on: !override
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    container_name: !reset null
    environment:
      # Label Sentry events as production (see api above).
      SENTRY_ENVIRONMENT: production
      # Absolute SPA base for notification deep links (run links + Slack/Teams Approve/Reject
      # buttons). The worker builds these and — unlike the api — is NOT passed CORS_ORIGINS, so
      # its documented CORS_ORIGINS fallback never fires here: without this, resolveAppBaseUrl()
      # returns undefined and the buttons/links are silently omitted. Derive it from the same
      # PUBLIC_HOSTNAME the api's CORS uses so there's one var to set. Override via APP_BASE_URL.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
      # codeAgent sandbox wiring (see the sandbox-runner service below). Set on BOTH worker
      # pools: codeAgent statically routes to `orchestrator-heavy`, but the default queue
      # still serves runs whose history predates that route (workflow.patched) and
      # single-node executions.
      SANDBOX_RUNNER_URL: "${SANDBOX_RUNNER_URL:-http://sandbox-runner:8099}"
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-}"
      CODE_AGENT_RUNS_DIR: "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
      # Write mode stays OFF unless this is explicitly "true" (the activity fails closed on
      # anything else). DECLARED here rather than omitted: compose passes ONLY the variables a
      # service names, so with no entry at all, setting CODE_AGENT_WRITE_ENABLED=true in
      # /opt/naary/.env reaches nothing — the operator sees the flag set and the node still
      # fails CODE_AGENT_WRITE_DISABLED, with the .env as the last place anyone would look.
      # The default is empty, so the posture is unchanged until someone sets it deliberately,
      # AFTER deploy/sandbox/egress-test.sh passes on this host.
      CODE_AGENT_WRITE_ENABLED: "${CODE_AGENT_WRITE_ENABLED:-}"
      # NB there is no CODE_AGENT_SANDBOX_READ any more (#680). It was declared here briefly
      # (#933) as the opt-in for isolating READ; read is now ALWAYS sandboxed, so the flag —
      # and the un-isolated in-worker path it guarded — are gone. codeAgent consequently
      # REQUIRES the `sandbox` profile below to be running; without it a run fails with
      # CODE_AGENT_SANDBOX_UNCONFIGURED naming the two settings to add.
    volumes:
      # The shared working-tree dir: the worker clones into it, the runner mounts it into
      # the sandbox. It MUST be the same path inside both containers as on the host — the
      # runner shells `docker run -v <path>` through the HOST docker, so the path is
      # resolved host-side (apps/sandbox-runner/src/config.ts). Hence one var on both sides.
      - "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}:${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
    # Close the base file's published 9091 (metrics). Nothing scrapes it over the network
    # in prod (Sentry gets the metrics), and "every published port is closed" (header
    # point 1) should actually include this one — it was the lone hole.
    ports: !override []
    # Drop the local-temporal dependency (Temporal is Cloud); wait only for migrations.
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  # Heavy task-queue worker (codeAgent's `orchestrator-heavy` queue, #453) — same prod
  # treatment as `worker`: the local-Temporal dependency is dropped (Temporal is Cloud,
  # so the base `depends_on: temporal` would reference the profile-gated-off service and
  # break `compose config`), the published metrics port is closed, Sentry env labeled.
  worker-heavy:
    container_name: !reset null
    environment:
      SENTRY_ENVIRONMENT: production
      # Same as `worker` — deep-link base for notifications this queue may emit.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
      # This is the pool codeAgent actually routes to — same sandbox wiring as `worker`,
      # including the write gate (see that block for why it is declared rather than omitted).
      SANDBOX_RUNNER_URL: "${SANDBOX_RUNNER_URL:-http://sandbox-runner:8099}"
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-}"
      CODE_AGENT_RUNS_DIR: "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
      CODE_AGENT_WRITE_ENABLED: "${CODE_AGENT_WRITE_ENABLED:-}"
    volumes:
      - "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}:${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
    ports: !override []
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  web:
    container_name: !reset null
    ports: !override [] # cloudflared forwards to web:80 inside the compose network

  # Cloudflare Tunnel: outbound-only connection to the edge. No inbound ports, free TLS,
  # hidden origin. Token comes from `terraform output -raw tunnel_token`.
  cloudflared:
    image: cloudflare/cloudflared:latest # pin a tag for reproducibility, e.g. :2024.12.1
    container_name: naary-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env (terraform output -raw tunnel_token)}
    depends_on:
      - web

  # HOST + per-container resource monitor (memory/swap/CPU/disk + OOM events) — the layer
  # Sentry (app-code profiling) and the OTLP app metrics don't cover. Prod-only sidecar,
  # NOT rolled on deploy (fixed name, like cloudflared/worker-heavy). Standard Netdata
  # host-monitoring mounts: read-only host /proc, /sys, /, and the docker socket (for
  # container names). SYS_PTRACE + apparmor:unconfined let it read per-process/cgroup stats.
  #
  # Access — two options, both keep the box's "no public ports" posture:
  #   • SSH tunnel (default, zero exposure): the dashboard is published on the LOOPBACK
  #     only (127.0.0.1:19999, mirroring postgres). Reach it with:
  #       ssh -L 19999:localhost:19999 root@<box>   →  http://localhost:19999
  #   • Netdata Cloud (no inbound at all): set NETDATA_CLAIM_TOKEN (+ NETDATA_CLAIM_ROOMS)
  #     in the box /opt/naary/.env; the agent connects OUTBOUND and you view it at
  #     app.netdata.cloud. Leave the token empty to stay SSH-tunnel-only.
  #
  # mem_limit caps the monitor itself (~256MB) so a monitoring sidecar can never be the
  # thing that pushes the box into OOM — the very failure it exists to watch for.
  netdata:
    image: netdata/netdata:stable # pin a digest/tag for reproducibility
    container_name: naary-netdata
    hostname: ${PUBLIC_HOSTNAME:-naary-prod} # the node's display name in Netdata
    restart: unless-stopped
    pid: host # accurate per-application process charts (apps.plugin)
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    mem_limit: 256m
    ports:
      - "127.0.0.1:19999:19999" # loopback only — SSH-tunnel to view; never public
    environment:
      # Optional Netdata Cloud claim (outbound-only; no inbound port needed). Empty ⇒ the
      # agent stays local-only, reachable solely via the SSH tunnel above.
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: ${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # container names (read-only)

  # ── codeAgent sandbox (design CLAUDE-CODE-NODE.md §8b.1, was deploy/sandbox/) ──────────
  # These two services are the prod home of what deploy/sandbox/docker-compose.sandbox.yml
  # prototyped, so the code-agent sandbox is usable on the box instead of a side stack.
  #
  # PROFILE-GATED (`sandbox`), like `temporal`/`postgres` are here: the runner REQUIRES
  # SANDBOX_RUNNER_TOKEN (it holds the Docker socket, so a tokenless runner is refused at
  # boot, by design). A hard `${...:?}` would break `compose config` — and therefore every
  # deploy — on boxes that haven't set one, and an empty token would just crash-loop a
  # Docker-privileged container. So they start only when the operator opts in:
  #
  #   1. add SANDBOX_RUNNER_TOKEN=<random> and COMPOSE_PROFILES=sandbox to /opt/naary/.env
  #   2. re-run Deploy. The four sandbox images the runner launches are BUILT IN CI and PULLED
  #      here like every other image — nothing is built on this box any more. deploy.yml pulls
  #      them by DIGEST and hands the runner SANDBOX_IMAGE_* + SANDBOX_REQUIRE_DIGEST=1, so what
  #      runs with the Docker socket in reach is immutable bytes rather than a re-pushable tag.
  #      (Local/dev hosts with no GHCR access keep building them by hand — deploy/sandbox/README.md.)
  #   3. /opt/naary/deploy/sandbox/egress-test.sh   (the acceptance gate — prove the sandbox
  #      can reach Anthropic and NOTHING else, on this host)
  #   4. /opt/naary/deploy/sandbox/smoke-test.sh "$SANDBOX_IMAGE_CLAUDE" …   (each image starts
  #      under the isolation flags — pass the digest refs so you smoke the bytes you deployed)
  #
  # Enabling codeAgent write mode (CODE_AGENT_WRITE_ENABLED) is a SEPARATE, later step —
  # this only makes the infrastructure available.
  sandbox-proxy:
    # Pinned by DIGEST for reproducibility — this proxy IS the security boundary, so it must
    # not drift (ubuntu/squid only ships _beta/edge tags; the digest is the stable anchor).
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    # No fixed container_name (it's global → collides with the egress test / a side stack).
    # The stable hostname the sandbox dials is a NETWORK ALIAS instead.
    profiles: ["sandbox"]
    restart: unless-stopped
    networks:
      sandbox-internal: # the sandbox reaches the proxy here…
        aliases:
          - naary-sandbox-proxy
      sandbox-egress: {} # …and the proxy reaches Anthropic out here
    volumes:
      # Relative to the project directory (/opt/naary on the box), like PG_DATA_DIR above —
      # deploy.yml ships deploy/sandbox/ alongside the compose files for exactly this.
      - ./deploy/sandbox/squid-allowlist.conf:/etc/squid/squid.conf:ro
    # Belt-and-braces hardening on the proxy container itself.
    read_only: true
    tmpfs:
      - /var/spool/squid
      - /var/run
    security_opt:
      - no-new-privileges:true

  # The runner: the ONLY app container with Docker access (host-root-adjacent). It launches
  # the ephemeral sandboxes. Kept OFF the worker on purpose — that split IS the containment,
  # so never move this mount onto worker/worker-heavy. Prod-only sidecar with a fixed name,
  # so (like cloudflared/netdata) it is not part of deploy.yml's rolling update.
  #
  # NOT publicly reachable: no published ports, and it sits on the app's `default` network
  # only, where the worker dials it as SANDBOX_RUNNER_URL (bearer-token authed). It is
  # deliberately NOT on sandbox-internal — the sandboxes it launches must not be able to
  # reach the thing that holds the Docker socket.
  sandbox-runner:
    build:
      context: .
      dockerfile: deploy/sandbox/runner.Dockerfile
    image: naary-sandbox-runner # replaced by the GHCR overlay (build reset there)
    container_name: naary-sandbox-runner
    profiles: ["sandbox"]
    restart: unless-stopped
    networks:
      - default
    environment:
      SANDBOX_RUNNER_TOKEN: "${SANDBOX_RUNNER_TOKEN:-}"
      SANDBOX_RUNS_DIR: "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
      SANDBOX_NETWORK: naary-sandbox-internal
      SANDBOX_PROXY_URL: http://naary-sandbox-proxy:3128
      # Per-TOOL images (#680): the runner maps the request's `tool` to one of these — a request
      # can never name an image (the runner holds the Docker socket). Each default is DISTINCT;
      # `SANDBOX_IMAGE` remains a claude-only alias for pre-#680 deploys.
      #
      # The `:latest` values here are the LOCAL-BUILD defaults, for a host without GHCR access.
      # A real deploy never uses them: deploy/docker-compose.ghcr.yml (layered last by CD)
      # replaces all four with digest-pinned GHCR refs and sets SANDBOX_REQUIRE_DIGEST=1, which
      # makes the runner refuse to boot on a mutable tag. That split is what keeps a contributor's
      # `docker build … :latest` working without weakening prod.
      SANDBOX_IMAGE_CLAUDE: "${SANDBOX_IMAGE_CLAUDE:-naary-claude-sandbox:latest}"
      SANDBOX_IMAGE_CURSOR: "${SANDBOX_IMAGE_CURSOR:-naary-cursor-sandbox:latest}"
      SANDBOX_IMAGE_COPILOT: "${SANDBOX_IMAGE_COPILOT:-naary-copilot-sandbox:latest}"
      SANDBOX_IMAGE_GEMINI: "${SANDBOX_IMAGE_GEMINI:-naary-gemini-sandbox:latest}"
      # OFF by default (a dev/local host builds `:latest` images). CD exports =1 when the sandbox
      # profile is active, so prod fails CLOSED if the digest refs ever go missing.
      SANDBOX_REQUIRE_DIGEST: "${SANDBOX_REQUIRE_DIGEST:-}"
      # The per-sandbox CONTAINMENT limits and the wall-clock cap, all read by the runner and
      # forwarded by nothing until now: the code's defaults (1 CPU / 2048MB / 256 pids / 15min)
      # were the only values prod could ever have. The defaults are the safe end, so this was an
      # inert knob rather than an unbounded sandbox — but an operator could neither TIGHTEN the
      # limits on a shared box nor raise the timeout for a long codeAgent run. Blank ⇒ the same
      # defaults as before (posInt treats blank as unset), so nothing changes until someone sets one.
      SANDBOX_CPUS: "${SANDBOX_CPUS:-}"
      SANDBOX_MEMORY_MB: "${SANDBOX_MEMORY_MB:-}"
      SANDBOX_PIDS: "${SANDBOX_PIDS:-}"
      SANDBOX_TIMEOUT_MS: "${SANDBOX_TIMEOUT_MS:-}"
    volumes:
      # Docker socket — this container's (contained) privilege.
      - /var/run/docker.sock:/var/run/docker.sock
      # Working trees: the SAME host path as the worker mounts, at the same path inside, so
      # the sibling `docker run -v <path>` (resolved on the host) points at the right dir.
      - "${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}:${SANDBOX_RUNS_DIR:-/var/lib/naary/sandbox-runs}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The runner image has no curl/wget — use node's fetch, like api/worker do.
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(\"http://127.0.0.1:8099/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# The two networks that realize sandbox containment (unchanged from deploy/sandbox/). Both
# carry explicit `name:`s because the runner attaches sandboxes by name, independently of the
# compose project. Compose MERGES this with the base file's implicit `default` network, which
# is what api/worker/web keep using.
#
#   sandbox-internal — internal:true → NO default gateway. A container here cannot route to
#                      the internet, the host, cloud metadata (169.254.169.254), or other
#                      stacks. The ONLY thing it can reach is the proxy (same network).
#   sandbox-egress   — an ordinary bridge; ONLY the proxy sits on it, giving the proxy (and
#                      nothing else) a path to the internet.
networks:
  sandbox-internal:
    name: naary-sandbox-internal
    internal: true
  sandbox-egress:
    name: naary-sandbox-egress

# Named volumes for the Netdata sidecar. Compose MERGES this top-level `volumes:` with the
# base file's (naary-pgdata / naary-temporal), so declaring only the new ones here is safe.
volumes:
  netdata-config:
  netdata-lib:
  netdata-cache:
