# Production overlay: self-hosted app (api/worker/web/postgres), exposed ONLY through a
# Cloudflare Tunnel, with Temporal on TEMPORAL CLOUD (not a local container).
#
# Run it together with the base compose from the repo root (or `pnpm prod`):
#   docker compose --env-file ./deploy/.env -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# What it changes vs the dev stack:
#   1. Closes every published port. Nothing is on the public or LAN interface — the
#      app is reachable ONLY via the tunnel. (postgres stays bound to 127.0.0.1 for
#      local ops / SSH port-forward, never the network.)
#   2. Adds the `cloudflared` tunnel container.
#   3. Uses Temporal Cloud: the base `temporal` start-dev container is profile-gated OFF
#      and api/worker connect to Cloud via env (deploy/.env.prod.example). Durable +
#      managed — no local SQLite to corrupt.
#
# `!override` clears the base port list (Docker Compose >= 2.24). If your compose is
# older, delete the `!override` tag and manually remove the `ports:` from the base file.

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432" # local ops only (psql over SSH tunnel); never exposed
    # Store the DB on the HOST filesystem (bind mount) instead of a named volume, so the
    # data lives in a real folder you can back up/copy/restore — and it survives even
    # `docker compose down -v` (which only removes named/anonymous volumes, not bind mounts).
    # Path is relative to where you run compose (the repo root). Override with PG_DATA_DIR.
    volumes: !override
      - "${PG_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data"

  # Temporal is TEMPORAL CLOUD in prod, not a local container — durable, managed, and
  # immune to the single-file SQLite corruption that took down the dev server. The app
  # connects to Cloud purely via env (TEMPORAL_ADDRESS/NAMESPACE/API_KEY — see
  # deploy/.env.prod.example; handled by @naary/temporal-config, no code change).
  # Profile-gate the base start-dev service so `up` never starts it. (A profiled service
  # is skipped unless its profile is enabled — hence api/worker also drop it from
  # depends_on below, or compose would error referencing an unstarted service.)
  temporal:
    profiles: ["local-temporal-disabled"]

  # api/worker/web are ROLLED on deploy (docker rollout: scale to 2 → wait for the new
  # container's healthcheck → stop the old). That requires NO fixed container_name (a
  # pinned name can't scale to 2) and NO published host ports (two replicas can't share
  # a bind) — hence `container_name: !reset null` on all three. Traffic keeps flowing
  # during the overlap because nothing addresses these by container name: cloudflared
  # dials web:80 and web's nginx re-resolves api:3000 per request (see apps/web/nginx.conf).
  api:
    container_name: !reset null
    ports: !override [] # reached internally as api:3000 (via web's nginx proxy)
    environment:
      # The browser origin the SPA is served from — used for CORS on the control plane.
      CORS_ORIGINS: "https://${PUBLIC_HOSTNAME:-naar-y.com}"
      # Absolute SPA base for the api's own deep links (transactional emails, connect callbacks).
      # The api would otherwise fall back to CORS_ORIGINS; set it explicitly so every service
      # derives links from one var and the fallback isn't load-bearing. Override via APP_BASE_URL.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
      # Swagger off in prod (audit #595): nginx also 404s /api/docs*, this is belt-and-
      # braces so the schema isn't served even if the proxy layer changes. Override
      # with SWAGGER_DISABLED=0 for a debugging session.
      SWAGGER_DISABLED: "${SWAGGER_DISABLED:-1}"
      # Label Sentry events as production (the code otherwise falls back to NODE_ENV → "development").
      SENTRY_ENVIRONMENT: production
    # Drop the local-temporal dependency (Temporal is Cloud); keep DB + migrations.
    depends_on: !override
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    container_name: !reset null
    environment:
      # Label Sentry events as production (see api above).
      SENTRY_ENVIRONMENT: production
      # Absolute SPA base for notification deep links (run links + Slack/Teams Approve/Reject
      # buttons). The worker builds these and — unlike the api — is NOT passed CORS_ORIGINS, so
      # its documented CORS_ORIGINS fallback never fires here: without this, resolveAppBaseUrl()
      # returns undefined and the buttons/links are silently omitted. Derive it from the same
      # PUBLIC_HOSTNAME the api's CORS uses so there's one var to set. Override via APP_BASE_URL.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
    # Close the base file's published 9091 (metrics). Nothing scrapes it over the network
    # in prod (Sentry gets the metrics), and "every published port is closed" (header
    # point 1) should actually include this one — it was the lone hole.
    ports: !override []
    # Drop the local-temporal dependency (Temporal is Cloud); wait only for migrations.
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  # Heavy task-queue worker (codeAgent's `orchestrator-heavy` queue, #453) — same prod
  # treatment as `worker`: the local-Temporal dependency is dropped (Temporal is Cloud,
  # so the base `depends_on: temporal` would reference the profile-gated-off service and
  # break `compose config`), the published metrics port is closed, Sentry env labeled.
  worker-heavy:
    container_name: !reset null
    environment:
      SENTRY_ENVIRONMENT: production
      # Same as `worker` — deep-link base for notifications this queue may emit.
      APP_BASE_URL: "${APP_BASE_URL:-https://${PUBLIC_HOSTNAME:-naar-y.com}}"
    ports: !override []
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  web:
    container_name: !reset null
    ports: !override [] # cloudflared forwards to web:80 inside the compose network

  # Cloudflare Tunnel: outbound-only connection to the edge. No inbound ports, free TLS,
  # hidden origin. Token comes from `terraform output -raw tunnel_token`.
  cloudflared:
    image: cloudflare/cloudflared:latest # pin a tag for reproducibility, e.g. :2024.12.1
    container_name: naary-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env (terraform output -raw tunnel_token)}
    depends_on:
      - web

  # HOST + per-container resource monitor (memory/swap/CPU/disk + OOM events) — the layer
  # Sentry (app-code profiling) and the OTLP app metrics don't cover. Prod-only sidecar,
  # NOT rolled on deploy (fixed name, like cloudflared/worker-heavy). Standard Netdata
  # host-monitoring mounts: read-only host /proc, /sys, /, and the docker socket (for
  # container names). SYS_PTRACE + apparmor:unconfined let it read per-process/cgroup stats.
  #
  # Access — two options, both keep the box's "no public ports" posture:
  #   • SSH tunnel (default, zero exposure): the dashboard is published on the LOOPBACK
  #     only (127.0.0.1:19999, mirroring postgres). Reach it with:
  #       ssh -L 19999:localhost:19999 root@<box>   →  http://localhost:19999
  #   • Netdata Cloud (no inbound at all): set NETDATA_CLAIM_TOKEN (+ NETDATA_CLAIM_ROOMS)
  #     in the box /opt/naary/.env; the agent connects OUTBOUND and you view it at
  #     app.netdata.cloud. Leave the token empty to stay SSH-tunnel-only.
  #
  # mem_limit caps the monitor itself (~256MB) so a monitoring sidecar can never be the
  # thing that pushes the box into OOM — the very failure it exists to watch for.
  netdata:
    image: netdata/netdata:stable # pin a digest/tag for reproducibility
    container_name: naary-netdata
    hostname: ${PUBLIC_HOSTNAME:-naary-prod} # the node's display name in Netdata
    restart: unless-stopped
    pid: host # accurate per-application process charts (apps.plugin)
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    mem_limit: 256m
    ports:
      - "127.0.0.1:19999:19999" # loopback only — SSH-tunnel to view; never public
    environment:
      # Optional Netdata Cloud claim (outbound-only; no inbound port needed). Empty ⇒ the
      # agent stays local-only, reachable solely via the SSH tunnel above.
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: ${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # container names (read-only)

# Named volumes for the Netdata sidecar. Compose MERGES this top-level `volumes:` with the
# base file's (naary-pgdata / naary-temporal), so declaring only the new ones here is safe.
volumes:
  netdata-config:
  netdata-lib:
  netdata-cache:
