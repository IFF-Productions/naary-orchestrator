# Neon overlay: the app database is NEON (managed serverless Postgres, pgvector
# included) instead of the in-stack container. Layer it LAST, on top of the prod overlay:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#                  -f deploy/docker-compose.neon.yml up -d --build
#
# Needs in .env (deploy/terraform emits both — see neon.tf / hetzner.tf):
#   DATABASE_URL          → Neon POOLED endpoint (…-pooler…?sslmode=require&pgbouncer=true)
#                           for api/worker: PgBouncer handles the many short Prisma conns.
#   MIGRATE_DATABASE_URL  → Neon DIRECT endpoint, migrations only (Prisma migrate needs a
#                           real session — advisory locks + DDL don't mix with pgbouncer).
#
# NOTE: the base file still interpolates ${POSTGRES_PASSWORD:?} even though the postgres
# service never starts (profiles gate starting, not parsing) — keep POSTGRES_* in .env.

services:
  # Profile-gate the local postgres off, same pattern as temporal in the prod overlay.
  postgres:
    profiles: ["local-postgres-disabled"]

  migrate:
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL in .env (Neon DIRECT endpoint)}
    depends_on: !override [] # no local postgres to wait for; Neon is already up

  api:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (Neon POOLED endpoint)}
    # Re-override (prod overlay waits on postgres healthy): only migrations gate startup.
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env (Neon POOLED endpoint)}
