# Egress allowlist proxy for the codeAgent sandbox (design CLAUDE-CODE-NODE.md §2.3 / §8b.1).
# The ONLY route out of the sandbox's internal (no-gateway) network is this proxy, and it
# permits exactly one destination: a TLS CONNECT to api.anthropic.com:443. Everything else is
# denied. This is the NETWORK-LAYER containment for Vector B (the Anthropic key can't be
# removed from the sandbox, only prevented from reaching anywhere it could be exfiltrated to).

# Only the allowlisted host, only on 443, only via CONNECT (TLS tunnel — we never see plaintext).
acl anthropic dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow the one tunnel we want; deny all else (including plain HTTP GETs and other CONNECTs).
http_access allow CONNECT SSL_ports anthropic
http_access deny all

http_port 3128

# No caching (a tunnel proxy has nothing to cache). Logs off: squid's unprivileged `proxy`
# user can't open /dev/stdout, and a tunnel allowlist has nothing worth logging anyway (also
# privacy-preserving). cache_log → /dev/null (world-writable) so startup doesn't fail.
cache deny all
access_log none
cache_log /dev/null
# Don't leak the client's identity upstream.
forwarded_for delete
via off
# Fail fast rather than hang if the upstream is unreachable.
connect_timeout 15 seconds
