# Egress allowlist proxy for the codeAgent sandbox (design CLAUDE-CODE-NODE.md §2.3 / §8b.1).
# The ONLY route out of the sandbox's internal (no-gateway) network is this proxy, and it permits
# exactly one destination PER SUPPORTED CLI: the API host that CLI must reach to function, on 443,
# via CONNECT. Everything else is denied. This is the NETWORK-LAYER containment for Vector B (a
# tenant credential can't be removed from the sandbox, only prevented from reaching anywhere it
# could be exfiltrated to).
#
# Keep this list MINIMAL and in step with the drivers (apps/worker/src/temporal/code-agent-drivers.ts)
# — every host added here is a place a hijacked run could POST the key to. If you don't use a given
# CLI, delete its line: an unreachable host is the strongest possible clamp on that driver.

# Only the allowlisted hosts, only on 443, only via CONNECT (TLS tunnel — we never see plaintext).
acl agent_api dstdomain api.anthropic.com               # claude  (@anthropic-ai/claude-code)
acl agent_api dstdomain api.cursor.com                  # cursor  (cursor-agent)
acl agent_api dstdomain api.githubcopilot.com           # copilot (@github/copilot)
acl agent_api dstdomain api.individual.githubcopilot.com
acl agent_api dstdomain generativelanguage.googleapis.com  # gemini (@google/gemini-cli)
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow the tunnels we want; deny all else (including plain HTTP GETs and other CONNECTs).
http_access allow CONNECT SSL_ports agent_api
http_access deny all

http_port 3128

# No caching (a tunnel proxy has nothing to cache). Logs off: squid's unprivileged `proxy`
# user can't open /dev/stdout, and a tunnel allowlist has nothing worth logging anyway (also
# privacy-preserving). cache_log → /dev/null (world-writable) so startup doesn't fail.
cache deny all
access_log none
cache_log /dev/null
# Don't leak the client's identity upstream.
forwarded_for delete
via off
# Fail fast rather than hang if the upstream is unreachable.
connect_timeout 15 seconds
