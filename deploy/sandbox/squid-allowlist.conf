# Egress allowlist proxy for the codeAgent sandbox (design CLAUDE-CODE-NODE.md §2.3 / §8b.1).
# The ONLY route out of the sandbox's internal (no-gateway) network is this proxy, and it permits
# exactly one destination PER SUPPORTED CLI: the API host that CLI must reach to function, on 443,
# via CONNECT. Everything else is denied. This is the NETWORK-LAYER containment for Vector B (a
# tenant credential can't be removed from the sandbox, only prevented from reaching anywhere it
# could be exfiltrated to).
#
# Keep this list MINIMAL and in step with the drivers (apps/worker/src/temporal/code-agent-drivers.ts)
# — every host added here is a place a hijacked run could POST the key to. If you don't use a given
# CLI, delete its line: an unreachable host is the strongest possible clamp on that driver.

# Only the allowlisted hosts, only on 443, only via CONNECT (TLS tunnel — we never see plaintext).
# The trailing status is how each entry was ESTABLISHED — a guess here is a broken feature or an
# unnecessary exfil path, so re-verify with deploy/sandbox/smoke-test.sh after any CLI bump.
#
# VERIFIED: the CLI ran on the internal network through THIS proxy and reached its provider
#           (rejected an invalid key) — i.e. these hosts are necessary and sufficient.
acl agent_api dstdomain api.anthropic.com                  # claude — VERIFIED (also egress-test.sh)
acl agent_api dstdomain generativelanguage.googleapis.com  # gemini — VERIFIED
# Cursor talks to api2.cursor.sh, NOT api.cursor.com: with only the latter the CLI fails with
# "Failed to reach the Cursor API. Check that your proxy is reachable" even though curl to
# api.cursor.com through this same proxy returns 200. Both vendor domains, hence the leading dots.
acl agent_api dstdomain .cursor.com .cursor.sh             # cursor — VERIFIED (needs .cursor.sh)
# UNVERIFIED end-to-end: the Copilot CLI rejects an invalid token LOCALLY, before making any
# request, so no credential-free probe can prove this list is sufficient. The API hosts below are
# reachable through the proxy (404 = allowed, connected). If a real copilot run fails to
# authenticate, it most likely also needs api.github.com for the token exchange — left commented
# out DELIBERATELY rather than added on a guess, because that host would also be a place a
# hijacked run could POST the token to (a gist/issue). Enable it knowingly, not by default.
acl agent_api dstdomain api.githubcopilot.com              # copilot — hosts reachable, run UNVERIFIED
acl agent_api dstdomain api.individual.githubcopilot.com
#acl agent_api dstdomain api.github.com                    # see the note above before enabling
acl SSL_ports port 443
acl CONNECT method CONNECT

# Allow the tunnels we want; deny all else (including plain HTTP GETs and other CONNECTs).
http_access allow CONNECT SSL_ports agent_api
http_access deny all

http_port 3128

# No caching (a tunnel proxy has nothing to cache). Logs off: squid's unprivileged `proxy`
# user can't open /dev/stdout, and a tunnel allowlist has nothing worth logging anyway (also
# privacy-preserving). cache_log → /dev/null (world-writable) so startup doesn't fail.
cache deny all
access_log none
cache_log /dev/null
# Don't leak the client's identity upstream.
forwarded_for delete
via off
# Fail fast rather than hang if the upstream is unreachable.
connect_timeout 15 seconds
