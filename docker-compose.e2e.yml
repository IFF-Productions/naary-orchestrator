# CI-only overlay that ISOLATES the e2e stack from a co-located prod stack on the
# same self-hosted host. The base compose hardcodes host-global container names
# (naary-postgres, …) and host ports (5432, 3000, 8081, …). Prod
# (deploy/docker-compose.prod.yml) inherits those, so without isolation the e2e job
# would bind/see PROD's containers and ports — the token mint would hit prod's
# Postgres (→ "password authentication failed") and e2e up/down could stop prod.
#
# Run it with a DEDICATED project so networks + named volumes are namespaced too:
#   docker compose -p naary-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
# `-p naary-e2e` makes the named volume `naary-e2e_naary-pgdata` (not prod's), and
# `down -v` under that project can only ever remove the e2e stack — never prod.
#
# Only HOST-published ports + container names change here. In-cluster wiring is
# unchanged: services still reach each other by SERVICE name on INTERNAL ports
# (postgres:5432, temporal:7233, api:3000, web:80), which compose DNS resolves from
# the service name, not the container_name or the host port.
services:
  postgres:
    container_name: naary-e2e-postgres
    ports: !override
      - "127.0.0.1:55432:5432"

  temporal:
    container_name: naary-e2e-temporal
    ports: !override
      - "127.0.0.1:57233:7233"
      - "127.0.0.1:58233:8233"

  migrate:
    container_name: naary-e2e-migrate

  api:
    container_name: naary-e2e-api
    ports: !override
      - "127.0.0.1:53000:3000"

  worker:
    container_name: naary-e2e-worker
    ports: !override
      - "127.0.0.1:59091:9091"

  web:
    container_name: naary-e2e-web
    ports: !override
      - "127.0.0.1:58081:80"
