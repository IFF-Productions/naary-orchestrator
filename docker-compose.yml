services:
  postgres:
    image: postgres:16
    container_name: naary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: naary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: naary_orchestrator
    ports:
      - '5432:5432'
    volumes:
      - naary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naary -d naary_orchestrator']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naary-pgdata:
