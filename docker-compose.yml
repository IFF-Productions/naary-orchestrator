# Shared runtime env for the backend services (api, worker, migrate). DATABASE_URL
# targets the `postgres` SERVICE host (not localhost — that's for host-run dev), and
# Temporal points at the `temporal` service. Secrets (ENCRYPTION_KEY, the DB
# password) come from the repo-root .env at runtime — never baked into the image.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-naary}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naary_orchestrator}?schema=public
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (see .env.example)}
  # Decrypt-only fallback during master-key rotation (see rotate-master-key CLI).
  # Set alongside a NEW ENCRYPTION_KEY, run the rewrap, then remove it.
  OLD_ENCRYPTION_KEY: ${OLD_ENCRYPTION_KEY:-}
  # External secret store for BYOK provider keys (#458). UNSET/`db` = the default
  # Postgres envelope store (unchanged). `vault` = HashiCorp Vault KV v2: the key
  # MATERIAL lives in Vault and Postgres keeps only the index row. Both the api (save)
  # and the worker (in-activity resolve) must agree, so they share this anchor.
  # ENCRYPTION_KEY stays REQUIRED either way — pre-existing rows and every other secret
  # (connection tokens, env secrets) remain DB-encrypted.
  SECRET_PROVIDER: ${SECRET_PROVIDER:-}
  VAULT_ADDR: ${VAULT_ADDR:-}
  VAULT_TOKEN: ${VAULT_TOKEN:-}
  VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-}
  VAULT_PATH_PREFIX: ${VAULT_PATH_PREFIX:-}
  VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
  # Per-request timeout against Vault (ms; default 5000). The one VAULT_* the code reads that
  # this list didn't forward — an operator raising it for a slow/remote Vault would have seen
  # no effect. A bad value THROWS at construction rather than degrading silently, which is
  # exactly why it must be settable.
  VAULT_TIMEOUT_MS: ${VAULT_TIMEOUT_MS:-}
  # Defaults to the in-stack dev server. Point at Temporal Cloud by overriding
  # TEMPORAL_ADDRESS + setting TEMPORAL_NAMESPACE and an auth method in .env
  # (TEMPORAL_API_KEY, or the mTLS cert/key paths). See @naary/temporal-config.
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-}
  TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
  TEMPORAL_TLS: ${TEMPORAL_TLS:-}
  TEMPORAL_TLS_CERT_PATH: ${TEMPORAL_TLS_CERT_PATH:-}
  TEMPORAL_TLS_KEY_PATH: ${TEMPORAL_TLS_KEY_PATH:-}
  TEMPORAL_TLS_SERVER_NAME: ${TEMPORAL_TLS_SERVER_NAME:-}
  # GitHub App (native GitHub connections via installation tokens + the install flow).
  # Both the api (install/callback controller) and the worker (mints installation
  # tokens for github_app connections in the integration/mcp activities) read these.
  # OFF unless set: no GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY ⇒ github_app auth and the
  # install flow are unavailable (githubAppConfig() returns null → AuthConfigError).
  # GITHUB_APP_SLUG is the app's URL slug (github.com/apps/<slug>) — required to build
  # the install URL. Values live in /opt/naary/.env; forwarded here so the containers
  # actually receive them (each service only gets the vars this anchor enumerates).
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  # Atlassian 3LO (native Jira/Confluence connections without a per-user API token). The
  # PLATFORM app's credentials — one Atlassian app per deployment, shared by every tenant —
  # which is why they are env and not a tenant setting. Both the api (authorize/callback) and
  # the worker (token refresh inside the integration activities) read them via
  # @naary/connections, hence this shared anchor rather than a per-service entry.
  #
  # These were read by the code and named in NO compose file, so `ATLASSIAN_OAUTH_CLIENT_ID=…`
  # in /opt/naary/.env reached nothing and the whole 3LO connection type was unreachable in
  # production — the #862 failure mode. Unset ⇒ Atlassian OAuth stays off (PAT-style
  # connections are unaffected), which is the same posture as before, but now reachable.
  # SCOPES is an override; empty ⇒ the code's DEFAULT_SCOPES.
  ATLASSIAN_OAUTH_CLIENT_ID: ${ATLASSIAN_OAUTH_CLIENT_ID:-}
  ATLASSIAN_OAUTH_CLIENT_SECRET: ${ATLASSIAN_OAUTH_CLIENT_SECRET:-}
  ATLASSIAN_OAUTH_SCOPES: ${ATLASSIAN_OAUTH_SCOPES:-}
  # Platform transactional email (#468 — invitation emails). OPT-IN: unset ⇒ the API's mailer
  # is a no-op (invitations still work via accept-on-login, just no email is sent). SMTP_URL is a
  # nodemailer connection URI (smtp://user:pass@host:port); MAIL_FROM is the sender. This is the
  # APP's own sender — distinct from the per-tenant `smtp` connection the sendEmail node uses.
  # Only the api reads these; harmless on the worker.
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  # Server-derived SPA base for links in transactional emails / connect callbacks (never a
  # request param). Falls back to the first http(s) CORS_ORIGINS entry, else a relative path.
  APP_BASE_URL: ${APP_BASE_URL:-}
  # Object storage: large-payload claim-checks AND hosted-form logo uploads. Unset = in-memory,
  # which is fine for claim-checks in a smoke test but makes logo UPLOADS fail closed with a 503
  # (a logo in a process's heap would vanish on the next rollout and differ per replica).
  # Credentials are forwarded too — without them a bucket is configured but unreachable, which was
  # the state of this file before logo uploads existed. S3_ENDPOINT targets an S3-compatible
  # provider (R2/B2/MinIO) and switches the client to path-style addressing.
  # Platform operators (comma-separated emails) — gates the Workers fleet view, which shows infra
  # telemetry for EVERY tenant. Unset = nobody sees it (fail closed, by design).
  PLATFORM_OPERATORS: ${PLATFORM_OPERATORS:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
  S3_BUCKET: ${S3_BUCKET:-}
  AWS_REGION: ${AWS_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # Observability (Sentry) — OFF unless a DSN is set. Events are scrubbed.
  # SENTRY_DSN is the SHARED fallback. Each app can instead report to its OWN Sentry project
  # via SENTRY_DSN_API / SENTRY_DSN_WORKER (set per-service below) — separate issue streams,
  # alert rules and quotas per app. Unset ⇒ that app falls back to SENTRY_DSN, and the
  # `component` tag still distinguishes them inside one shared project.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  # CPU profiling (api/worker). Trace-based: profiles only inside sampled transactions,
  # so it needs SENTRY_TRACES_SAMPLE_RATE > 0 too.
  SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
  # Release stamp for errors/traces (the deploy sets this to the deployed tag).
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # OTLP metrics export (Datadog via OTLP, #462) — OFF unless OTEL_EXPORTER_OTLP_ENDPOINT
  # is set. Attributes are scrubbed on egress. HEADERS carries the intake auth (e.g.
  # "DD-API-KEY=..."); PROTOCOL is http/protobuf for the http exporter.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
  # Structured JSON logging verbosity (trace|debug|info|warn|error|fatal).
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Prometheus /metrics — the worker serves it on this port; the api serves it on
  # its main port (3000). Set to 0 to disable the worker metrics server.
  METRICS_PORT: ${METRICS_PORT:-9091}
  # Resume-from-failed-node snapshots (#799). Default ON in code; `off` disables them. Both
  # sides need it: the WORKER writes the snapshot and the API decides whether to offer resume,
  # so a value that reached only one of them would make the UI and the runtime disagree.
  # deploy/.env.prod.example has documented this switch since it shipped — it was declared in
  # no compose file, so `RESUME_SNAPSHOTS=off` there was inert.
  RESUME_SNAPSHOTS: ${RESUME_SNAPSHOTS:-}

services:
  postgres:
    # pgvector/pgvector is a drop-in postgres:16 image with the `vector` extension preinstalled
    # (needed by the RAG VectorChunk table). Standard postgres:16 otherwise, so nothing else changes.
    image: pgvector/pgvector:pg16
    container_name: naary-postgres
    restart: unless-stopped
    environment:
      # Values come from the repo-root .env (auto-loaded by docker compose).
      # No defaults for the password — it must be set, so nothing secret-shaped
      # is ever hardcoded here. See .env.example.
      POSTGRES_USER: ${POSTGRES_USER:-naary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-naary_orchestrator}
    ports:
      - '5432:5432'
    volumes:
      - naary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Human login is Firebase Auth (replaced Keycloak). The browser authenticates
  # directly with Firebase (Google-hosted); the API verifies the ID token with the
  # Firebase Admin SDK — so there is no identity-provider container in the stack.
  # See FIREBASE_* in .env.example and the api service below.

  # Temporal dev server (single binary, sqlite-backed) — the durable-execution
  # spine. Not a production cluster (that's Temporal Cloud / self-hosted, see
  # PRODUCTION-READINESS.md §3.A); fine for a local stack. UI at :8233.
  temporal:
    image: temporalio/temporal:1.7.2
    container_name: naary-temporal
    restart: unless-stopped
    # The image runs as uid 1000; the named `naary-temporal` volume is root-owned,
    # so SQLite can't create its db file. Run as root for the dev stack so the
    # persisted db is writable (dev-only; a real cluster uses external storage).
    user: root
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/data/temporal.db',
        '--log-level',
        'warn',
      ]
    ports:
      - '7233:7233' # gRPC — the api client + worker connect here
      - '8233:8233' # Web UI
    volumes:
      - naary-temporal:/data
    healthcheck:
      test:
        ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: apply Prisma migrations, then exit. The api/worker wait for this to
  # complete successfully so they never start against an un-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: naary-backend
    container_name: naary-migrate
    command: ['pnpm', '--filter', '@naary/db', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # NestJS control plane.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: naary-backend
    container_name: naary-api
    restart: unless-stopped
    command: ['pnpm', '--filter', '@naary/api', 'start']
    environment:
      <<: *backend-env
      PORT: '3000'
      # This app's OWN Sentry project (falls back to SENTRY_DSN when unset).
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      # Self-healing (Phase 2): the API also hosts a small Temporal worker polling the heal
      # queue, because generating and saving a fix need GraphGeneratorService/GraphsService.
      # UNSET ⇒ ON, but the feature is still per-workflow opt-in and off by default, so an
      # unset value polls an empty queue and costs nothing. Set to `off` to stop this replica
      # polling — for a deployment that runs the heal worker separately, or during an incident.
      SELF_HEAL_WORKER: ${SELF_HEAL_WORKER:-}
      # Allow the containerized web app (and the Vite dev server) as CORS origins.
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
      # Firebase Auth (human login). The API verifies ID tokens with the Admin SDK,
      # which REQUIRES a service account — provide it inline as
      # FIREBASE_SERVICE_ACCOUNT_JSON (or a mounted file via
      # GOOGLE_APPLICATION_CREDENTIALS). UNSET ⇒ Firebase auth is off (nry_ tokens
      # still work). See firebase-verifier.ts.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      # The ADC alternative the comment above has always named — a PATH, inside the container,
      # to a mounted service-account file. It was never forwarded, so the documented "or a
      # mounted file" route silently did nothing. NOTE it needs a volume mount too: putting a
      # host path here without mounting it leaves the Admin SDK opening a file that isn't there.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIREBASE_TENANT_CLAIM: ${FIREBASE_TENANT_CLAIM:-tenant}
      # OAuth consent return URLs. Both must match EXACTLY what was registered with the
      # provider, so they are explicit env and never derived from a (spoofable) request Host.
      # Their code defaults are `http://localhost:3000/...`, which is right for `pnpm start` and
      # useless in prod — and with neither declared, an operator could not correct them: the
      # generic MCP OAuth flow and the Atlassian 3LO callback both sent users to localhost.
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      ATLASSIAN_OAUTH_REDIRECT_URI: ${ATLASSIAN_OAUTH_REDIRECT_URI:-}
      # Early-access allowlist (comma-separated emails). Unset ⇒ open sign-up. See
      # deploy/.env.prod.example. Gates Firebase user logins only; nry_ tokens + public
      # ingress are unaffected.
      ACCESS_ALLOWED_EMAILS: ${ACCESS_ALLOWED_EMAILS:-}
      # Instance-wide 2FA requirement (#457). Unset/false ⇒ off (default). `true` ⇒ a Firebase
      # session without a second factor gets 403 `mfa_required` (the SPA shows an enrolment
      # screen). nry_ tokens + all @Public() ingress are exempt. Enrol before enabling — see
      # deploy/.env.prod.example.
      REQUIRE_MFA: ${REQUIRE_MFA:-}
      # SAML SSO (#455, docs/design/SAML-SSO.md) — api-only (the worker has no auth surface).
      # OFF unless all three are set: no SSO_SESSION_SECRET / SSO_SP_ENTITY_ID / SSO_ACS_URL
      # ⇒ /sso/metadata answers 503, the ACS refuses, and the guard's `nrys_` branch verifies
      # nothing. Firebase login is unaffected either way. The SP entity id + ACS URL must match
      # what the IdP admin entered, so they are explicit (never derived from a request Host).
      SSO_SESSION_SECRET: ${SSO_SESSION_SECRET:-}
      SSO_SP_ENTITY_ID: ${SSO_SP_ENTITY_ID:-}
      SSO_ACS_URL: ${SSO_ACS_URL:-}
      SSO_SESSION_TTL_SECONDS: ${SSO_SESSION_TTL_SECONDS:-}
      # May a workspace owner/admin REGISTER an IdP themselves (PUT /tenants/:id/sso)? Default
      # NO: registering declares "this cert may assert these email domains" and no request can
      # prove domain ownership. Operators register connections with
      # src/sso/register-sso-connection.ts after checking the claim.
      SSO_SELF_SERVICE: ${SSO_SELF_SERVICE:-}
      # Feature flags (OpenFeature + Flagsmith) — api-only (only @naary/api imports
      # @naary/flags). OFF unless FLAGSMITH_ENVIRONMENT_KEY (server-side `ser.` key) is
      # set: no key ⇒ every flag resolves to its safe code default (fail-safe). For a
      # self-hosted instance, set FLAGSMITH_API_URL to the in-stack service and bring it
      # up with the docker-compose.flagsmith.yml overlay; unset ⇒ Flagsmith SaaS.
      FLAGSMITH_ENVIRONMENT_KEY: ${FLAGSMITH_ENVIRONMENT_KEY:-}
      FLAGSMITH_API_URL: ${FLAGSMITH_API_URL:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Temporal worker — the generic runGraph interpreter + activities. Stateless;
  # scale by raising `replicas` (execution state lives in Temporal, not here).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: naary-backend
    container_name: naary-worker
    restart: unless-stopped
    command: ['pnpm', '--filter', '@naary/worker', 'start']
    environment:
      <<: *backend-env
      # This app's OWN Sentry project (falls back to SENTRY_DSN when unset). Both worker
      # services share it — they run the same code, so one worker project is the useful split.
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      # Queue-mode per-replica capacity knobs (unset ⇒ Temporal SDK defaults; see worker-tuning.ts).
      # Raise `replicas` to scale horizontally; tune these to size each replica.
      WORKER_MAX_ACTIVITIES: ${WORKER_MAX_ACTIVITIES:-}
      WORKER_MAX_WORKFLOW_TASKS: ${WORKER_MAX_WORKFLOW_TASKS:-}
      WORKER_MAX_CACHED_WORKFLOWS: ${WORKER_MAX_CACHED_WORKFLOWS:-}
      WORKER_SHUTDOWN_GRACE: ${WORKER_SHUTDOWN_GRACE:-} # e.g. "30s" — drain in-flight activities on deploy
      # `off` stops this replica emitting fleet heartbeats (it then reads as offline in the
      # Workers view, same as a crash). On by default. The opt-out the code documents was
      # unreachable — no compose file forwarded it.
      WORKER_HEARTBEAT: ${WORKER_HEARTBEAT:-}
    ports:
      - '9091:9091' # Prometheus /metrics scrape
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness = the metrics server answers (it starts BEFORE the Temporal connect in
    # worker.ts, so this proves the process is up; a bad boot exits the container and
    # never reports healthy). Skipped when metrics are disabled (METRICS_PORT=0).
    # Prod rolling deploys (docker rollout) gate on this before retiring the old worker.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '[ "$${METRICS_PORT:-9091}" = "0" ] || node -e "fetch(\"http://127.0.0.1:\"+(process.env.METRICS_PORT||9091)+\"/metrics\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Heavy worker pool (Queue-mode §3.3): polls `orchestrator-heavy` so long/heavy activities
  # (codeAgent) can't starve interactive latency on the main `orchestrator` queue. Same image +
  # bundle as `worker` (registers all activities) — only the queue differs. MUST stay in the deploy:
  # the workflow statically routes codeAgent here, so removing this pool would strand those runs.
  # Fewer, longer activities ⇒ a low activity-slot default.
  worker-heavy:
    build:
      context: .
      dockerfile: Dockerfile
    image: naary-backend
    container_name: naary-worker-heavy
    restart: unless-stopped
    command: ['pnpm', '--filter', '@naary/worker', 'start']
    environment:
      <<: *backend-env
      # Same worker code ⇒ same Sentry project as the default worker.
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      WORKER_TASK_QUEUE: orchestrator-heavy
      # Heavy activities are few + long — a small slot cap keeps a burst from over-committing a box.
      WORKER_MAX_ACTIVITIES: ${WORKER_HEAVY_MAX_ACTIVITIES:-4}
      WORKER_MAX_WORKFLOW_TASKS: ${WORKER_MAX_WORKFLOW_TASKS:-}
      WORKER_MAX_CACHED_WORKFLOWS: ${WORKER_MAX_CACHED_WORKFLOWS:-}
      WORKER_SHUTDOWN_GRACE: ${WORKER_SHUTDOWN_GRACE:-}
      WORKER_HEARTBEAT: ${WORKER_HEARTBEAT:-} # see `worker` above
    ports:
      - '9092:9091' # distinct host port; container still serves /metrics on 9091
    depends_on:
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '[ "$${METRICS_PORT:-9091}" = "0" ] || node -e "fetch(\"http://127.0.0.1:\"+(process.env.METRICS_PORT||9091)+\"/metrics\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Web app — Vite SPA built to static files, served by nginx (proxies /api → api).
  # The Firebase web config is baked at BUILD time (Vite inlines VITE_* env), so it
  # is passed as build args from .env. Public values (Firebase web keys are not
  # secrets); UNSET ⇒ the SPA's Firebase login is unavailable (nry_ paste still works).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        # App Check: public reCAPTCHA site key + which provider it is
        # (enterprise|v3). UNSET ⇒ App Check not initialized (see apps/web/src/lib/app-check.ts).
        VITE_FIREBASE_APPCHECK_SITE_KEY: ${VITE_FIREBASE_APPCHECK_SITE_KEY:-}
        VITE_FIREBASE_APPCHECK_PROVIDER: ${VITE_FIREBASE_APPCHECK_PROVIDER:-}
        # Sentry browser DSN (publishable) — UNSET ⇒ Sentry off in the SPA.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-}
        # Browser profiling / Session Replay sample rates (see apps/web/src/instrument.ts
        # for the defaults when unset: profiles 0, replay session 0 / on-error 1).
        VITE_SENTRY_PROFILES_SAMPLE_RATE: ${VITE_SENTRY_PROFILES_SAMPLE_RATE:-}
        VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-}
        VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE:-}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
    image: naary-web
    container_name: naary-web
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      api:
        condition: service_started
    # nginx serving static files — "is it answering on :80" is the whole readiness story.
    # busybox wget ships in nginx:alpine (no curl there). Prod rolling deploys
    # (docker rollout) gate on this before retiring the old web container.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  naary-pgdata:
  naary-temporal:
